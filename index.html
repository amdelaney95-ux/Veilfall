const ASSET_FAILED = {};
function assetUrl(rel){ return ASSET_BASE + rel; }
// The key a unit's art would be filed under. Enemies are keyed by region and
// role so one file covers "the Whispering Wilds' brute" wherever it appears.
// One Hero drawing, four palette swaps, and the variant is chosen from the
// name the player typed — so two people's Heroes look different without the
// game ever asking a question about it, and the same name always gives the
// same Hero. Deriving it rather than storing it also means no save migration.
const HERO_VARIANTS = ['hero','hero_ember','hero_verdant','hero_tide','hero_dusk'];
function heroVariantKey(name){
  let h = 2166136261;
  const str = String(name || '');
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return HERO_VARIANTS[Math.abs(h | 0) % HERO_VARIANTS.length];
}
function spriteKeyFor(unit, regionId){
  if(!unit.isEnemy){
    return unit.classId === 'hero' ? heroVariantKey(unit.name) : unit.classId;
  }
  if(unit.role==='guard') return 'castle_guard';
  if(unit.role==='demonlord') return unit.phase===2 ? 'demonlord_2' : 'demonlord';
  if(unit.role==='summon') return 'abyssal_wraith';
  return (regionId||currentRegionId()||'wilderness') + '_' + unit.role;
}
function spriteUrl(key){
  const rel = ASSET_MANIFEST.sprites[key];
  if(!rel) return null;
  const url = assetUrl(rel);
  return ASSET_FAILED[url] ? null : url;
}
function spriteFor(unit){ return spriteUrl(spriteKeyFor(unit)); }
function currentRegionId(){
  if(state && state.travel) return state.travel.regionId;
  if(state && state.guildMission) return state.guildMission.regionId;
  return null;
}
// Which backdrop belongs to whatever the player is looking at. Combat is
// only one of these — the road, the towns and the castle all have a place.
// Returns null on screens that should show no scenery at all (the title, the
// name prompt, the records table).
function sceneKey(){
  if(!state) return null;
  const screen = state.screen;
  if(screen==='combat' && state.combat){
    const ctx = state.combat.context;
    if(ctx==='castleGauntlet') return 'castle';
    if(ctx==='demonlord') return 'throne_room';
    return currentRegionId();
  }
  switch(screen){
    case 'regionIntro': case 'routeChoice': return currentRegionId();
    // Event screens show the event, not the place. The illustration is the
    // more informative of the two and the player has already seen the region.
    case 'event': case 'eventResult': case 'eventFollowup':
      return state.currentEvent ? ('event_' + state.currentEvent.kind) : currentRegionId();
    case 'epilogue': {
      const step = EPILOGUE[Math.min(EPILOGUE.length - 1, Math.max(0, state.epilogueIndex || 0))];
      return step ? step.scene : null;
    }
    case 'finalLegIntro': return state.regionPool ? state.regionPool[4] : null;
    case 'town': case 'shop': case 'trainer': case 'guild': case 'partyStats': case 'saveCode':
      // Each town gets its own key so they can look like different places.
      return state.legIndex>=1 && state.legIndex<=3 ? ('town' + state.legIndex) : null;
    case 'bossIntro': return state.bossIntro ? state.bossIntro.scene : null;
    case 'castleGate': return 'castle';
    case 'castleGate2': return 'throne_room';
    case 'victory': return 'victory';
    default: return null;
  }
}
function backgroundFor(){
  const key = sceneKey();
  const rel = key ? ASSET_MANIFEST.backgrounds[key] : null;
  return rel ? assetUrl(rel) : null;
}
// Stand-in scenery: sky, horizon and ground in colours that suit the place.
// Not a substitute for art — just enough that the band reads as somewhere
// rather than as a broken image. Real backgrounds override it entirely.
const SCENE_TINTS = {
  //            sky         horizon glow  ground
  wilderness: ['#2b4a6b',  '#4a7a3e',    '#16281a'],
  desert:     ['#c98f45',  '#f0cf8a',    '#8a6534'],
  volcano:    ['#3d1410',  '#c94a1e',    '#1a0c08'],
  swamp:      ['#4a5a50',  '#6d7d54',    '#1e2a24'],
  plains:     ['#6f96c4',  '#a8b05a',    '#3c4a2c'],
  town1:      ['#3a2d4a',  '#e0a355',    '#241a26'],
  town2:      ['#2e3450',  '#e8b062',    '#1d2030'],
  town3:      ['#43304a',  '#d99450',    '#261a28'],
  castle:     ['#221c3a',  '#5a4488',    '#0d0a18'],
  throne_room:['#350d18',  '#a82838',    '#12050a'],
  victory:    ['#7fa8d8',  '#f5d885',    '#3a3418']
};
function sceneGradient(key){
  const t = SCENE_TINTS[key] || ['#2a2c50','#3d4070','#12142a'];
  // Sky, a bright band at the horizon, then ground — with a hard edge where
  // they meet. A smooth blend reads as an unfinished gradient; the hard line
  // reads as a landscape.
  return `linear-gradient(180deg, ${t[0]} 0%, ${t[0]} 34%, ${t[1]} 52%, ${t[1]} 62%, ${t[2]} 63%, ${t[2]} 100%)`;
}
// Resolves when everything is in, or when it is clear something will never
// arrive — a missing file must not leave the player staring at a progress bar.
function preloadAssets(onProgress){
  const urls = []
    .concat(Object.keys(ASSET_MANIFEST.sprites).map(k=>assetUrl(ASSET_MANIFEST.sprites[k])))
    .concat(Object.keys(ASSET_MANIFEST.backgrounds).map(k=>assetUrl(ASSET_MANIFEST.backgrounds[k])))
    .concat(ASSET_MANIFEST.fx ? [assetUrl(ASSET_MANIFEST.fx.sheet)] : []);
  if(!HAS_DOM || !urls.length) return Promise.resolve({total:0, loaded:0, failed:0});
  let loaded = 0, failed = 0;
  return Promise.all(urls.map(url=>new Promise(resolve=>{
    const img = new Image();
    img.onload = () => { ASSET_CACHE[url] = img; loaded++; if(onProgress) onProgress(loaded+failed, urls.length); resolve(); };
    img.onerror = () => { failed++; ASSET_FAILED[url] = true; if(onProgress) onProgress(loaded+failed, urls.length); resolve(); };
    img.src = url;
  }))).then(()=>({total:urls.length, loaded, failed}));
}

/* ---------- what the player is currently looking at ----------
   During playback the screen shows a state that lags behind the real one:
   the maths is already done, but the bars have not caught up yet. */
function viewHp(unit){
  const c = state.combat;
  if(c && c.view && Object.prototype.hasOwnProperty.call(c.view.hp, unit.id)) return c.view.hp[unit.id];
  return unit.hp;
}
function viewMp(unit){
  const c = state.combat;
  if(c && c.view && Object.prototype.hasOwnProperty.call(c.view.mp, unit.id)) return c.view.mp[unit.id];
  return unit.mp;
}
function viewIsHidden(unit){
  const c = state.combat;
  return !!(c && c.view && c.view.hidden[unit.id]);
}
function viewLogLines(){
  const c = state.combat;
  if(!c) return [];
  const n = (c.view && typeof c.view.logShown==='number') ? c.view.logShown : c.log.length;
  return c.log.slice(0, n);
}

// What the air is doing, per scene. The backgrounds paint their weather in
// statically; this is the part that moves. One kind per scene on purpose —
// two overlapping systems read as a dirty screen rather than as weather.
const SCENE_WEATHER = {
  volcano:'ember', throne_room:'ember', castle:'ember', home:'ember',
  town1:'ember', town2:'ember', town3:'ember',
  wilderness:'mist', swamp:'mist', montage_hunt:'mist',
  plains:'wind', victory:'wind', desert:'wind', montage_board:null,
  goddess:'motes'
};
const WEATHER_COUNT = {ember:14, motes:16, mist:5, wind:9};
function weatherHtml(scene){
  const kind = SCENE_WEATHER[scene];
  if(!kind) return '';
  const n = WEATHER_COUNT[kind] || 10;
  let out = '';
  for(let i=0;i<n;i++){
    // Deterministic scatter. Math.random() here would reshuffle every time
    // the stage rebuilds, which happens on every summon and every death.
    const a = (i*97)%100, b = (i*61)%100, c = (i*43)%100;
    if(kind==='mist'){
      out += `<i style="top:${8+b*0.74}%;left:${-30+a*0.4}%;animation-duration:${16+c*0.12}s;animation-delay:-${a*0.2}s"></i>`;
    } else if(kind==='wind'){
      out += `<i style="top:${6+b*0.86}%;left:${-10+a*0.2}%;animation-duration:${4+c*0.05}s;animation-delay:-${a*0.09}s"></i>`;
    } else {
      out += `<i style="bottom:${a*0.35}%;left:${2+b*0.94}%;animation-duration:${5+c*0.07}s;animation-delay:-${a*0.1}s"></i>`;
    }
  }
  return `<div class="stage-weather wx-${kind}">${out}</div>`;
}

/* ---------- the stage ---------- */
const ROLE_TINT = {
  grunt:'#6d6a4e', skirmisher:'#8a5f36', brute:'#586079', boss:'#a83f28',
  guard:'#4b3a63', demonlord:'#7b1f2e', summon:'#432a55'
};
function unitTint(unit){
  if(!unit.isEnemy) return unit.classDef ? unit.classDef.color : '#7a6a4a';
  return ROLE_TINT[unit.role] || '#6d6a4e';
}
function unitInitial(unit){
  if(!unit.isEnemy && unit.classDef) return unit.classDef.letter;
  return (unit.name||'?').replace(/^(The|A) /,'').charAt(0).toUpperCase();
}
function unitIsBig(unit){ return unit.isEnemy && (unit.role==='boss' || unit.role==='demonlord'); }
function stageUnitHtml(unit){
  const sprite = spriteFor(unit);
  // A sheet is a 4x4 grid: one row per state, four frames across. Uniform on
  // purpose — the CSS that plays it needs no per-character numbers, only a
  // row offset. Characters with no art yet keep the placeholder silhouette,
  // so the two can sit side by side on the same stage.
  const style = sprite
    ? `background-image:url('${sprite}')`
    : `background:linear-gradient(180deg, ${unitTint(unit)} 0%, rgba(0,0,0,0.55) 140%)`;
  const cls = sprite ? 'sheet st-idle' : 'placeholder';
  const hpNums = unit.isEnemy ? `<div class="unit-name">${viewHp(unit)}/${unit.maxHp}</div>` : '';
  const size = unit.role==='demonlord' ? 'titan' : unitIsBig(unit) ? 'boss' : '';
  return `<div class="unit ${size} ${sprite?'drawn':''}" data-id="${unit.id}" onclick="stageUnitClicked('${unit.id}')">
    <div class="unit-sprite ${cls}" style="${style}">${sprite?'':unitInitial(unit)}</div>
    <div class="unit-bar"><i style="width:100%"></i></div>
    <div class="unit-name">${unit.name}</div>
    ${hpNums}
  </div>`;
}
// Real art when the manifest has it, procedural scenery when it does not.
function sceneBgStyle(key){
  const bg = backgroundFor();
  return bg ? `background-image:url('${bg}')` : `background:${sceneGradient(key)}`;
}
function stageRoster(){
  const c = state.combat;
  if(!c) return [];
  return c.enemies.concat(c.allies);
}
// Rebuilds only when the cast changes. An in-place update is what keeps
// floating damage numbers and hit animations alive across a re-render — the
// whole reason the stage sits outside #app.
function updateBattleStage(){
  if(!HAS_DOM) return;
  const el = document.getElementById('battleStage');
  if(!el) return;
  const c = state.combat;
  const scene = sceneKey();
  const inCombat = !!(c && state.screen==='combat');

  if(!inCombat){
    // A strip of scenery for the road, the towns and the castle approach.
    if(!scene){ el.hidden = true; el.dataset.key = ''; el.classList.remove('scene-band'); return; }
    el.hidden = false;
    // Three modes: a strip of scenery, an event illustration, or a full
    // epilogue plate with the cast standing in it.
    const isPlate = state.screen === 'epilogue' || state.screen === 'bossIntro';
    const mode = isPlate ? 'scene-plate'
               : (scene.indexOf('event_') === 0 ? 'scene-card' : 'scene-band');
    ['scene-band','scene-card','scene-plate'].forEach(c=>el.classList.toggle(c, c===mode));
    const solo = state.screen === 'bossIntro' && state.bossIntro
      ? state.bossIntro.spriteKey : null;
    const step = EPILOGUE[Math.min(EPILOGUE.length - 1, Math.max(0, state.epilogueIndex || 0))];
    const cast = (mode === 'scene-plate' && !solo && step && step.cast) ? epilogueCast() : [];
    const bandKey = mode + ':' + scene + '|' + (solo || cast.map(c=>c.classId).join(','));
    if(el.dataset.key !== bandKey){
      const figures = solo ? soloCastHtml(solo)
                   : cast.length ? `<div class="stage-cast">${cast.map(castMemberHtml).join('')}</div>`
                   : '';
      el.innerHTML = `<div class="stage-bg" style="${sceneBgStyle(scene)}"></div>` +
        weatherHtml(scene) + figures;
      el.dataset.key = bandKey;
    }
    return;
  }
  el.classList.remove('scene-band','scene-card','scene-plate');
  el.hidden = false;

  const visibleFoes = c.enemies.filter(e=>!viewIsHidden(e));
  // The phase is part of the key: two different sprites for the same unit id
  // means the id alone no longer identifies what is on screen.
  const key = 'fight:' + scene + '|' + visibleFoes.map(e=>e.id + ':' + (e.phase||1)).join(',')
            + '|' + c.allies.map(a=>a.id).join(',');
  if(el.dataset.key !== key){
    // A big beat's flash and shout are children of the stage, and the stage
    // is rebuilt whenever the cast changes — which happens two beats after
    // the Demon Lord changes form, when its summons appear. Left alone, the
    // one animation in the game that most needs to finish was cut off by the
    // event immediately after it. Carry them across the rebuild.
    const carried = Array.prototype.slice.call(el.querySelectorAll('.stage-flash, .stage-shout'));
    el.innerHTML =
      `<div class="stage-bg" style="${sceneBgStyle(scene)}"></div>` +
      weatherHtml(scene) +
      `<div class="stage-banner" id="stageBanner"></div>` +
      `<div class="stage-row foes">${visibleFoes.map(stageUnitHtml).join('') || '<span class="stage-empty">the field is clear</span>'}</div>` +
      `<div class="stage-row party">${c.allies.map(stageUnitHtml).join('')}</div>`;
    carried.forEach(n=>el.appendChild(n));
    el.dataset.key = key;
  }

  const choice = state.pendingActionChoice;
  const banner = document.getElementById('stageBanner');
  if(banner){
    // Always non-empty, so the rows below never shift as the text changes.
    banner.textContent = c.playing ? ('Round ' + (c.round-1))
      : choice ? 'choose a target'
      : c.pendingActor ? (dispName(c.pendingActor) + "'s turn")
      : ('Round ' + (c.round-1));
  }
  stageRoster().forEach(unit=>{
    const node = el.querySelector('.unit[data-id="' + unit.id + '"]');
    if(!node) return;
    const hp = viewHp(unit);
    const bar = node.querySelector('.unit-bar > i');
    if(bar) bar.style.width = Math.max(0, Math.min(100, Math.round(hp/unit.maxHp*100))) + '%';
    if(unit.isEnemy){
      const nums = node.querySelectorAll('.unit-name')[1];
      if(nums) nums.textContent = hp + '/' + unit.maxHp;
    }
    node.classList.toggle('gone', hp<=0);
    node.classList.toggle('acting', !c.playing && c.pendingActor===unit);
    let targetable = false;
    if(choice && !c.playing){
      if(choice.target==='singleEnemy') targetable = unit.isEnemy && hp>0;
      else if(choice.target==='singleAlly') targetable = !unit.isEnemy && hp>0;
      else if(choice.target==='singleDeadAlly') targetable = !unit.isEnemy && hp<=0;
    }
    node.classList.toggle('targetable', targetable);
  });
}
function stageUnitClicked(id){
  const c = state.combat;
  if(!c || c.playing) return;
  const choice = state.pendingActionChoice;
  if(!choice) return;
  const unit = stageRoster().find(u=>u.id===id);
  if(!unit) return;
  if(choice.target==='singleEnemy' && unit.isEnemy && unit.hp>0) combatChooseTarget(id);
  else if(choice.target==='singleAlly' && !unit.isEnemy && unit.hp>0) combatChooseTarget(id);
  else if(choice.target==='singleDeadAlly' && !unit.isEnemy && unit.hp<=0) combatChooseTarget(id);
}
function stageFloater(unitId, text, cls){
  if(!HAS_DOM) return;
  const el = document.getElementById('battleStage');
  if(!el) return;
  const node = el.querySelector('.unit[data-id="' + unitId + '"]');
  if(!node) return;
  const span = document.createElement('span');
  span.className = 'floater ' + (cls||'');
  span.textContent = text;
  // An area attack lands four numbers on four units in the same instant, and
  // a damaging status lands a second one on a unit that already has one. Stack
  // them upwards instead of printing them on top of each other.
  const live = node.querySelectorAll('.floater').length;
  if(live) span.style.transform = 'translateY(' + (-15 * live) + 'px)';
  node.appendChild(span);
  setTimeout(()=>{ if(span.parentNode) span.parentNode.removeChild(span); }, 1100);
}
// Play one of the four sheet rows on a unit. Attack and hurt drop back to
// idle on their own; death holds its final frame, which the .gone styling
// then fades. A no-op for units still using placeholders.
const SPRITE_STATE_MS = {attack:380, hurt:320, death:560};
function stageUnitState(unitId, stateName){
  if(!HAS_DOM) return;
  const el = document.getElementById('battleStage');
  const node = el && el.querySelector('.unit[data-id="' + unitId + '"] .unit-sprite.sheet');
  if(!node) return;
  node.classList.remove('st-idle','st-attack','st-hurt','st-death');
  void node.offsetWidth;                 // restart the animation rather than ignore a second hit
  node.classList.add('st-' + stateName);
  if(node._revert){ clearTimeout(node._revert); node._revert = null; }
  if(stateName==='attack' || stateName==='hurt'){
    node._revert = setTimeout(()=>{
      node.classList.remove('st-' + stateName);
      node.classList.add('st-idle');
    }, SPRITE_STATE_MS[stateName]);
  }
}
// Shake the stage, not the page: the log and the buttons underneath stay
// still and readable while the picture takes the hit.
function stageShake(level){
  if(!HAS_DOM) return;
  const el = document.getElementById('battleStage');
  if(!el) return;
  el.classList.remove('shake-1','shake-2');
  void el.offsetWidth;
  el.classList.add('shake-' + (level||1));
  if(el._shake) clearTimeout(el._shake);
  el._shake = setTimeout(()=>el.classList.remove('shake-1','shake-2'), level===2 ? 1100 : 500);
}
// The one moment in a run that gets the full treatment.
function stageBigBeat(text){
  if(!HAS_DOM) return;
  const el = document.getElementById('battleStage');
  if(!el) return;
  stageShake(2);
  const flash = document.createElement('div');
  flash.className = 'stage-flash';
  el.appendChild(flash);
  setTimeout(()=>{ if(flash.parentNode) flash.parentNode.removeChild(flash); }, 1000);
  if(text){
    const shout = document.createElement('div');
    shout.className = 'stage-shout';
    shout.textContent = text;
    el.appendChild(shout);
    setTimeout(()=>{ if(shout.parentNode) shout.parentNode.removeChild(shout); }, 1600);
  }
}
// Swap a unit's sheet in place. The Demon Lord's second form is a different
// sprite, and the stage only rebuilds when the cast list changes — which at
// the phase change it does not, because the wraiths it summons are held
// hidden until their own beat plays. Without this the climax of the game
// showed the first form for another second and a half, and would have shown
// it for the rest of the fight if the summons were ever suppressed.
function stageSwapSprite(unitId){
  if(!HAS_DOM) return;
  const el = document.getElementById('battleStage');
  if(!el) return;
  const unit = stageRoster().find(u=>u.id===unitId);
  const node = el.querySelector('.unit[data-id="' + unitId + '"] .unit-sprite');
  if(!unit || !node) return;
  const sprite = spriteFor(unit);
  if(sprite) node.style.backgroundImage = "url('" + sprite + "')";
}
function stageHitFlash(unitId){
  if(!HAS_DOM) return;
  const el = document.getElementById('battleStage');
  if(!el) return;
  const node = el.querySelector('.unit[data-id="' + unitId + '"]');
  if(!node) return;
  node.classList.remove('hurt');
  void node.offsetWidth;      // restart the animation rather than ignore the second hit
  node.classList.add('hurt');
  setTimeout(()=>node.classList.remove('hurt'), 340);
}

/* ---------- the party bar, updated in place ---------- */
const PARTY_BAR_HIDDEN_ON = ['intro','blessing','nameEntry','records','bestiary','loadCode'];
function updatePartyBar(){
  if(!HAS_DOM) return;
  const el = document.getElementById('partyBar');
  if(!el) return;
  if(!state.party.length || PARTY_BAR_HIDDEN_ON.indexOf(state.screen)>=0){
    el.innerHTML = ''; el.dataset.key = '';
    return;
  }
  const key = state.party.map(p=>p.id).join(',');
  if(el.dataset.key !== key){
    el.innerHTML = renderPartyBar();
    el.dataset.key = key;
  }
  // Update numbers and bar widths in place so they slide rather than jump.
  const chips = el.querySelectorAll('.chip');
  state.party.forEach((p,i)=>{
    const chip = chips[i];
    if(!chip) return;
    const hp = viewHp(p), mp = viewMp(p);
    chip.classList.toggle('dead', hp<=0);
    const fills = chip.querySelectorAll('.bar-fill');
    if(fills[0]) fills[0].style.width = Math.max(0,Math.min(100,Math.round(hp/p.maxHp*100))) + '%';
    if(fills[1]) fills[1].style.width = Math.max(0,Math.min(100,Math.round(mp/Math.max(1,p.maxMp)*100))) + '%';
    const nums = chip.querySelectorAll('.chip-nums span');
    if(nums[0]) nums[0].textContent = hp + '/' + p.maxHp + ' HP';
    if(nums[1]) nums[1].textContent = mp + '/' + p.maxMp + ' MP';
    const lvl = chip.querySelectorAll('.chip-name span')[1];
    if(lvl) lvl.textContent = 'Lv.' + p.level;
  });
  const gold = el.querySelector('.gold-line');
  if(gold) gold.textContent = '⟡ ' + state.gold + ' gold';
}


/* ---------- timed playback ---------- */
const COMBAT_SPEEDS = [
  {key:'slow',    label:'Slow',    beat:400},
  {key:'normal',  label:'Normal',  beat:210},
  {key:'fast',    label:'Fast',    beat:95},
  {key:'instant', label:'Instant', beat:0}
];
// How long each kind of beat lingers, as a multiple of the speed setting.
// Zero-weight events (a bar moving, MP being spent) resolve in the same tick
// as whatever caused them rather than adding a pause of their own.
const FX_WEIGHT = {
  round:0.75, turn:0.3, hit:1, dot:0.9, healed:0.9, status:0.5, defend:0.5,
  stun:0.8, death:1.2, revive:1.3, phase:1.6, summon:1.6, guardian:1.3,
  log:0.5, hp:0, mp:0
};
function combatSpeedKey(){
  return (state && state.combatSpeed) || defaultCombatSpeed();
}
function defaultCombatSpeed(){
  // Someone who has asked their system for reduced motion should not have to
  // find the setting themselves.
  if(HAS_DOM && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return 'instant';
  return 'normal';
}
function combatBeatMs(){
  const found = COMBAT_SPEEDS.find(sp=>sp.key===combatSpeedKey());
  return found ? found.beat : 210;
}
function setCombatSpeed(key){
  state.combatSpeed = key;
  const c = state.combat;
  if(key==='instant' && c && c.playing){ endPlayback(); return; }
  render();
}
// Snapshots what the player can currently see, then clears the tape. Called
// immediately before a batch of resolution so the recording that follows can
// be replayed from this starting point.
function beginTurnBatch(){
  const c = state.combat;
  if(!c) return;
  c.timeline = [];
  c.view = {hp:{}, mp:{}, hidden:{}, logShown:c.log.length};
  c.enemies.concat(c.allies).forEach(u=>{ c.view.hp[u.id]=u.hp; c.view.mp[u.id]=u.mp; });
}
function presentTimeline(){
  const c = state.combat;
  if(!c){ render(); return; }
  if(!HAS_DOM || combatBeatMs()===0 || !c.timeline || !c.timeline.length){
    endPlayback();
    return;
  }
  c.playing = true;
  render();          // draw the stage and the "resolving" panel before the first beat
  stepTimeline();
}
function stepTimeline(){
  const c = state.combat;
  if(!c || !c.playing) return;
  if(!c.timeline.length){ endPlayback(); return; }
  let delay = 0;
  while(c.timeline.length && delay===0){
    const ev = c.timeline.shift();
    const hold = applyFx(ev);
    if(ev.t === 'cast'){
      // A cast holds for as long as its effect takes to arrive, scaled to pace.
      delay = Math.round((hold || 0) * vfxSpeed());
      continue;
    }
    const w = FX_WEIGHT[ev.t];
    delay = Math.round(combatBeatMs() * (w===undefined ? 0.5 : w));
  }
  updateBattleStage();
  updatePartyBar();
  updateCombatLog();
  c.timer = setTimeout(stepTimeline, Math.max(16, delay));
}
// Dropping the view is all that "finish immediately" needs to mean: the real
// state has been correct since the moment the action was taken, so falling
// back to it shows the final position with no further work.
function endPlayback(){
  const c = state.combat;
  if(!c) return;
  if(c.timer){ clearTimeout(c.timer); c.timer = null; }
  c.playing = false;
  c.timeline = [];
  c.view = null;
  render();
}
function skipPlayback(){
  const c = state.combat;
  if(c && c.playing) endPlayback();
}
/* ---------- combat effects ----------
   Every action now opens with a 'cast' beat, and the stage plays something
   for it: a slash across the target, an arrow leaving the bow and crossing
   the field, a fireball, a meteor. The four attack frames on each sheet are
   the body of the move; this is the part that leaves the body.

   Built for an offline cache, so it is deliberately cheap. One 3KB sprite
   sheet (assets/fx/fx.png, generated by art/fx.py) supplies every slash,
   burst and projectile, and everything else is a handful of absolutely
   positioned elements driven by the Web Animations API and thrown away when
   they finish. There are no canvases, no timers of their own and no
   per-frame work: the browser does the tweening.

   Timings are authored at the Normal pace and scaled with the player's pace
   setting. Each effect returns how long the timeline should wait before the
   damage numbers land, so the number appears when the blade arrives rather
   than when the button was pressed. */
const VFX_BASE_MS = 210;
function vfxSpeed(){
  const b = combatBeatMs();
  return b ? Math.max(0.45, Math.min(1.9, b / VFX_BASE_MS)) : 0;
}
function vfxStage(){ return HAS_DOM ? document.getElementById('battleStage') : null; }
function vfxScale(){
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sprite-scale'));
  return v > 0 ? v : 2;
}
function vfxBox(id){
  const st = vfxStage();
  const n = st && st.querySelector('.unit[data-id="' + id + '"] .unit-sprite');
  if(!n) return null;
  const r = n.getBoundingClientRect(), s = st.getBoundingClientRect();
  return {x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2,
          w: r.width, h: r.height, top: r.top - s.top};
}
function vfxEl(cls, css, under){
  const st = vfxStage();
  if(!st) return null;
  const d = document.createElement('div');
  d.className = 'vfx ' + (cls || '');
  Object.assign(d.style, css || {});
  // A wash goes UNDER the cast (straight after the backdrop), so it darkens
  // the room without darkening the people in it.
  if(under && st.firstChild) st.insertBefore(d, st.firstChild.nextSibling);
  else st.appendChild(d);
  return d;
}
function vfxRun(el, frames, dur, delay, easing){
  if(!el || !el.animate) return;
  const sp = vfxSpeed();
  const a = el.animate(frames, {duration: Math.max(16, dur * sp), delay: (delay || 0) * sp,
                                easing: easing || 'linear', fill: 'forwards'});
  a.onfinish = () => { if(el.parentNode) el.parentNode.removeChild(el); };
  return a;
}
function fxMeta(){ return ASSET_MANIFEST.fx || null; }
function fxSheetCss(cell){
  const m = fxMeta();
  return {backgroundImage: `url('${assetUrl(m.sheet)}')`,
          backgroundSize: `${m.cols * cell}px ${m.rows * cell}px`};
}
// One of the sheet's four-frame effects, centred on (x, y).
function vfxPlay(name, x, y, o){
  o = o || {};
  const m = fxMeta();
  if(!m || m.anims[name] === undefined) return;
  const cell = m.cell * vfxScale() * (o.size || 1);
  const el = vfxEl('', Object.assign({left: (x - cell / 2) + 'px', top: (y - cell / 2) + 'px',
    width: cell + 'px', height: cell + 'px', backgroundPositionY: (-m.anims[name] * cell) + 'px',
    transform: o.flip ? 'scaleX(-1)' : ''}, fxSheetCss(cell)));
  vfxRun(el, [{backgroundPositionX: '0px', opacity: 1},
              {backgroundPositionX: (-4 * cell) + 'px', opacity: 1}],
         o.dur || 320, o.delay, 'steps(4, end)');
}
// A single-frame piece flown from one point to another, pointing along its path.
function vfxShoot(name, from, to, o){
  o = o || {};
  const m = fxMeta();
  const s = m && m.singles[name];
  if(!s || !from || !to) return;
  const cell = m.cell * vfxScale() * (o.size || 1);
  const dx = to.x - from.x, dy = to.y - from.y;
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const el = vfxEl('', Object.assign({left: (from.x - cell / 2) + 'px', top: (from.y - cell / 2) + 'px',
    width: cell + 'px', height: cell + 'px',
    backgroundPosition: `${-s[0] * cell}px ${-s[1] * cell}px`}, fxSheetCss(cell)));
  vfxRun(el, [{transform: `translate(0px,0px) rotate(${ang}deg)`, opacity: 1},
              {transform: `translate(${dx}px,${dy}px) rotate(${ang}deg)`, opacity: 1}],
         o.dur || 200, o.delay, o.ease || 'linear');
}
// A tint over the room: under the cast, or (flash) over everything.
function vfxWash(color, peak, dur, delay, flash){
  const el = vfxEl(flash ? 'flash' : 'wash', {background: color}, !flash);
  vfxRun(el, [{opacity: 0}, {opacity: peak, offset: 0.2}, {opacity: peak, offset: 0.7}, {opacity: 0}],
         dur, delay);
}
// A column of light dropped onto a point from the top of the stage.
function vfxBeam(x, y, w, color, dur, delay){
  const el = vfxEl('beam', {left: (x - w / 2) + 'px', top: '0px', width: w + 'px', height: y + 'px',
    background: `linear-gradient(180deg, transparent 0%, ${color} 70%, #fff8e0 100%)`});
  vfxRun(el, [{opacity: 0, transform: 'scaleX(0.2)'}, {opacity: 1, transform: 'scaleX(1)', offset: 0.25},
              {opacity: 0.9, transform: 'scaleX(0.8)', offset: 0.7}, {opacity: 0, transform: 'scaleX(0.1)'}],
         dur, delay);
}
function vfxRing(x, y, r, color, dur, delay){
  const el = vfxEl('ring', {left: (x - r) + 'px', top: (y - r) + 'px', width: 2 * r + 'px',
    height: 2 * r + 'px', borderColor: color});
  vfxRun(el, [{opacity: 1, transform: 'scale(0.3)'}, {opacity: 0, transform: 'scale(1.3)'}], dur, delay,
         'ease-out');
}
// Jagged lightning between two points, as crisp SVG rather than a bitmap:
// it has to span any distance and costs nothing to store.
function vfxBolt(a, b, dur, delay){
  const st = vfxStage();
  if(!st || !a || !b) return;
  const pts = [[a.x, a.y]];
  const n = 6;
  for(let i = 1; i < n; i++){
    const t = i / n;
    const j = (i % 2 ? 1 : -1) * (6 + (i * 7) % 9);
    pts.push([a.x + (b.x - a.x) * t + j, a.y + (b.y - a.y) * t + j * 0.4]);
  }
  pts.push([b.x, b.y]);
  const p = pts.map(q => q[0].toFixed(0) + ',' + q[1].toFixed(0)).join(' ');
  const el = vfxEl('bolt', {inset: '0'});
  if(!el) return;
  el.innerHTML = `<svg width="100%" height="100%" shape-rendering="crispEdges">
    <polyline points="${p}" fill="none" stroke="#8fb8e8" stroke-width="7" stroke-opacity="0.45"/>
    <polyline points="${p}" fill="none" stroke="#fff4c0" stroke-width="3"/></svg>`;
  vfxRun(el, [{opacity: 1}, {opacity: 0.2, offset: 0.4}, {opacity: 1, offset: 0.55}, {opacity: 0}], dur, delay);
}
// Move or tint a unit itself: a leap, a vanish, a glow.
function vfxUnit(id, frames, dur, delay){
  const st = vfxStage();
  const n = st && st.querySelector('.unit[data-id="' + id + '"]');
  if(!n || !n.animate) return;
  const sp = vfxSpeed();
  n.animate(frames, {duration: dur * sp, delay: (delay || 0) * sp, easing: 'ease-in-out'});
}
function vfxLater(ms, fn){ setTimeout(fn, ms * vfxSpeed()); }
// The name of a big move, called out on the stage. Smaller and quicker than
// the Demon Lord's shout, and reusing its outlined lettering.
function vfxCallout(text, delay){
  const el = vfxEl('callout', {});
  if(!el) return;
  el.textContent = text;
  vfxRun(el, [{opacity: 0, transform: 'scale(0.85)'}, {opacity: 1, transform: 'scale(1)', offset: 0.15},
              {opacity: 1, offset: 0.75}, {opacity: 0}], 900, delay);
}

// ---- the moves ----------------------------------------------------------
function vfxUpperOf(box){ return box ? {x: box.x, y: box.top + box.h * 0.3} : null; }
function vfxHandOf(box, unit){
  // Roughly where a party member's weapon is on their sheet: up and to the
  // right of centre, since they face the enemy row at the upper right.
  if(!box) return null;
  return unit && !unit.isEnemy ? {x: box.x + box.w * 0.25, y: box.y - box.h * 0.2} : {x: box.x, y: box.y};
}
function vfxCentre(boxes){
  const b = boxes.filter(Boolean);
  if(!b.length) return null;
  return {x: b.reduce((s, q) => s + q.x, 0) / b.length, y: b.reduce((s, q) => s + q.y, 0) / b.length};
}
function vfxBasic(A, T, actor){
  const t = T[0];
  if(!t) return 250;
  if(actor.isEnemy){
    if(actor.role === 'demonlord'){ vfxPlay('xslash', t.x, t.y, {size: 1.8, delay: 150, dur: 300}); return 340; }
    const big = actor.role === 'boss' || actor.role === 'guard';
    vfxPlay('claw', t.x, t.y, {size: big ? 1.8 : 1.3, delay: 130, dur: 260});
    return 300;
  }
  const hand = vfxHandOf(A, actor);
  switch(actor.classId){
    case 'archer':
      vfxShoot('arrow', hand, t, {delay: 190, dur: 170});
      vfxPlay('impact', t.x, t.y, {delay: 350, dur: 200});
      return 380;
    case 'mage':
      vfxShoot('spark', hand, t, {delay: 180, dur: 200});
      vfxPlay('impact', t.x, t.y, {delay: 370, dur: 200});
      return 400;
    case 'healer':
      vfxShoot('holyorb', hand, t, {delay: 180, dur: 220, size: 0.7});
      vfxPlay('holy', t.x, t.y, {delay: 390, dur: 240});
      return 420;
    default:
      vfxPlay('slash', t.x, t.y, {size: 1.5, delay: 150, dur: 260});
      return 300;
  }
}

    T.forEach((t, i) => t && vfxPlay('dark', t.x, t.y, {size: 1.8, delay: 280 + i * 70, dur: 380}));
    return 640 + T.length * 70; },
};
function vfxItem(ev, T){
  const t = T[0];
  if(!t) return 300;
  if(ev.item === 'ether'){ vfxRing(t.x, t.y, 28, '#8fb8e8', 420, 100); vfxPlay('ice', t.x, t.y, {size: 0.8, delay: 120, dur: 300}); }
  else if(ev.item === 'elixir'){ vfxPlay('holy', t.x, t.y, {size: 1.4, delay: 100, dur: 320}); vfxPlay('heal', t.x, t.y, {size: 1.5, delay: 180, dur: 480}); }
  else vfxPlay('heal', t.x, t.y, {size: 1.3, delay: 100, dur: 460});
  return 480;
}
// Plays a cast and returns how long, at Normal pace, the timeline should hold.
function playCastFx(ev){
  const st = vfxStage();
  if(!st || !fxMeta() || !st.animate) return 0;
  const actor = stageRoster().find(u => u.id === ev.actorId);
  if(!actor) return 0;
  const A = vfxBox(ev.actorId);
  const T = (ev.targetIds || []).map(vfxBox);
  if(ev.kind === 'item') return vfxItem(ev, T);
  const move = VFX_SKILLS[ev.name];
  if(move) return move(A, T, actor, ev);
  if(ev.kind === 'attack' || ev.kind === 'debuffEnemy') return vfxBasic(A, T, actor);
  if(ev.kind === 'aoeAttack'){
    T.forEach((t, i) => t && vfxPlay(actor.isEnemy ? 'claw' : 'impact', t.x, t.y, {delay: 150 + i * 60, dur: 260}));
    return 360 + T.length * 60;
  }
  return 250;
}

function applyFx(ev){
  const c = state.combat;
  if(!c || !c.view) return;
  switch(ev.t){
    case 'cast': {
      // Items are handed over, not swung.
      if(ev.kind !== 'item') stageUnitState(ev.actorId, 'attack');
      c.view.castActor = ev.actorId;
      return playCastFx(ev);
    }
    case 'log': c.view.logShown = Math.min(c.log.length, c.view.logShown + 1); break;
    case 'hp': c.view.hp[ev.id] = ev.hp; break;
    case 'mp': c.view.mp[ev.id] = ev.mp; break;
    case 'summon': (ev.ids||[]).forEach(id=>{ delete c.view.hidden[id]; }); break;
    case 'hit':
      // The swing was already played by the cast beat. An area attack lands
      // several hits from one swing; replaying it per hit made the attacker
      // stutter through the same frames three times.
      if(c.view.castActor !== ev.actorId) stageUnitState(ev.actorId, 'attack');
      stageUnitState(ev.targetId, 'hurt');
      stageHitFlash(ev.targetId);
      stageFloater(ev.targetId, '-' + ev.amount, ev.crit ? 'crit' : 'dmg');
      if(ev.crit) stageShake(1);
      break;
    case 'dot':
      stageUnitState(ev.id, 'hurt');
      stageHitFlash(ev.id);
      stageFloater(ev.id, '-' + ev.amount, 'dmg');
      break;
    case 'healed': stageFloater(ev.targetId, '+' + ev.amount, 'heal'); break;
    case 'status': stageFloater(ev.id, ev.label, 'status'); break;
    case 'stun': stageFloater(ev.id, ev.label, 'status'); break;
    case 'guardian': stageFloater(ev.id, 'shielded!', 'heal'); break;
    case 'revive': stageUnitState(ev.id, 'idle'); stageFloater(ev.id, 'revived!', 'heal'); break;
    case 'death': {
      stageUnitState(ev.id, 'death');
      // The last enemy of the run falling is worth the same weight as it
      // changing form. Everything else just dies.
      const dead = (c.enemies||[]).find(e=>e.id===ev.id);
      if(dead && dead.role==='demonlord') stageBigBeat('The Demon Lord Falls');
      break;
    }
    case 'phase':
      stageSwapSprite(ev.id);
      stageUnitState(ev.id, 'hurt');
      stageHitFlash(ev.id);
      stageBigBeat('The Demon Lord Changes');
      break;
  }
}

function formatDuration(ms){
  if(!ms || ms<0) return null;
  const mins = Math.round(ms/60000);
  if(mins<1) return 'under a minute';
  if(mins<60) return mins + (mins===1 ? ' minute' : ' minutes');
  const h = Math.floor(mins/60), m = mins%60;
  return h + (h===1 ? ' hour' : ' hours') + (m ? ' ' + m + ' min' : '');
}
function copySaveCode(){
  const el = document.getElementById('saveCodeBox');
  if(!el) return;
  el.focus(); el.select();
  try { el.setSelectionRange(0, el.value.length); } catch(e){}
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
  if(!ok && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value).catch(()=>{});
    ok = true;
  }
  state.saveCodeCopied = ok;
  render();
}

function renderBestiary(){
  const b = readBestiary();
  const total = BESTIARY.length;
  const found = BESTIARY.filter(row=>b.seen[row.key]).length;
  const base = ASSET_MANIFEST.frameSize || 64;
  const sections = Object.keys(BESTIARY_GROUPS).map(group=>{
    const rows = BESTIARY_GROUPS[group];
    const cells = rows.map(row=>{
      const url = b.seen[row.key] ? spriteUrl(row.key) : null;
      if(!url){
        return `<div class="bestiary-cell locked">
          <div class="bestiary-empty">?</div>
          <div class="bestiary-name">— — —</div>
          <div class="bestiary-note">Not yet met</div>
        </div>`;
      }
      // A 96px sprite in the same 88px box as a 64px one would show the Demon
      // Lord at the size of a wolf. Scaling the box by the frame size instead
      // keeps every creature at the same pixel scale, which is the only way a
      // gallery of them says anything true about how big they are.
      // Capped at 132px, the most a grid cell has room for. The 96px forms
      // used to land exactly on it; the 128px Demon Lord would overflow.
      const w = Math.min(132, Math.round(88 * (ASSET_MANIFEST.frameSizes?.[row.key] || base) / base));
      const kills = b.slain[row.key] || 0;
      return `<div class="bestiary-cell">

    default: body = '<p>...</p>';
  }
  app.innerHTML = `<div class="codex-inner">${body}</div>`;

  updatePartyBar();

/* ---------- choosing a road ----------
   The one screen in the run where the player decides what KIND of leg they are
   about to have. Everything on the cards is derived from the ROUTES table
   rather than written out beside it, so a tag cannot drift from the number it
   is describing — the balance work behind the roads is worth nothing if the
   screen quietly misreports it. */
function routeTags(road){
  const tags = [];
  if(road.encounters > 0) tags.push({label:`+${road.encounters} fight`, tone:'bad'});
  if(road.encounters < 0) tags.push({label:`${road.encounters} fight`, tone:'good'});
  if(road.events > 0) tags.push({label:'an extra waypoint', tone:'good'});
  if(road.events < 0) tags.push({label:'no waypoints', tone:'bad'});
  if(road.comp === 'swarm') tags.push({label:'packs of weaker foes', tone:'flat'});
  if(road.comp === 'heavy') tags.push({label:'fewer, bigger foes', tone:'flat'});
  if(road.enemyMult > 1) tags.push({label:`enemies +${Math.round((road.enemyMult-1)*100)}%`, tone:'bad'});
  if(road.recover > 0.30) tags.push({label:'you recover well between fights', tone:'good'});
  if(road.recover < 0.30) tags.push({label:'little rest between fights', tone:'bad'});
  if(road.toll) tags.push({label:`the road itself costs you ${Math.round(road.toll*100)}% health a stage`, tone:'bad'});
  if(road.goldMult > 1) tags.push({label:`gold ×${road.goldMult.toFixed(2).replace(/0$/,'')}`, tone:'good'});
  if(road.expMult > 1) tags.push({label:`experience ×${road.expMult}`, tone:'good'});
  // Threshold, not "> 1": at 1.2 / 1.25 / 1.3 all three roads carried an
  // identical "better drops" tag, which tells the player nothing at all. A tag
  // that appears on every option is decoration.
  if(road.dropMult >= 1.4) tags.push({label:'far better drops', tone:'good'});
  else if(road.dropMult > 1.1) tags.push({label:'slightly better drops', tone:'good'});
  return tags;
}
// How hard a road is to walk, for the green / yellow / red on its card. It is
// derived from the same tags the card prints — no costs is easy, one is
// medium, more is hard — so the colour cannot drift from the numbers any more
// than a tag can. It rates the walking, which is what a player sees and feels;
// it is NOT the win rate. The roads measure within about three points of each
// other at the end of a run, because the hard road pays for itself (see ROUTES).
const ROUTE_RISK_RANK = {easy:0, medium:1, hard:2};
const ROUTE_RISK_LABEL = {easy:'Easy', medium:'Medium', hard:'Hard'};
function routeRisk(road){
  const costs = routeTags(road).filter(g=>g.tone==='bad').length;
  return costs === 0 ? 'easy' : costs === 1 ? 'medium' : 'hard';
}
// The picture behind a path card: a region's plate at 2x, centred on `view`.
// Falls back to the stand-in gradient when the plate is missing, the same way
// the scene band does, so a copy of the file without assets/ still has cards
// that look like places rather than empty boxes.
function sceneArtHtml(key, view){
  const rel = ASSET_MANIFEST.backgrounds[key];
  const url = rel ? assetUrl(rel) : null;
  const image = (url && !ASSET_FAILED[url]) ? `url('${url}')` : sceneGradient(key);
  const fx = view ? view[0] : 190, fy = view ? view[1] : 107;
  return `<span class="road-art" aria-hidden="true"><span class="road-plate" style="--fx:${fx};--fy:${fy};background-image:${image}"></span></span>`;
}
function chooseRoute(id){
  const t = state.travel;
  if(!t || !routeDef(id)) return;
  t.route = id;
  t.nodes = buildRegionPath(t.tier, id);
  t.nodeIndex = 0;
  advanceRegion();
  render();
}
function renderRouteChoice(){
  const t = state.travel;
  const region = REGIONS[t.regionId];
  const views = SCENE_VIEWS[t.regionId] || {};
  // Easiest first, so the three read top to bottom as green, yellow, red.
  // sort() is stable, so roads of equal difficulty keep the ROUTES order.
  const roads = ROUTES.slice().sort((a,b)=>ROUTE_RISK_RANK[routeRisk(a)] - ROUTE_RISK_RANK[routeRisk(b)]);
  const cards = roads.map(road=>{
    const [name, blurb] = ROUTE_NAMES[t.regionId][road.id];
    const risk = routeRisk(road);
    const tags = routeTags(road).map(g=>`<span class="road-tag ${g.tone}">${g.label}</span>`).join('');
    return `
    <button class="road ${road.kind} risk-${risk}" onclick="chooseRoute('${road.id}')">
      ${sceneArtHtml(t.regionId, views[road.id])}
      <span class="road-head"><span class="road-risk">${ROUTE_RISK_LABEL[risk]}</span><span class="road-name">${name}</span></span>
      <span class="road-blurb">${blurb}</span>
      <span class="road-tags">${tags}</span>
    </button>`;
  }).join('');
  return `
  <div class="eyebrow">${region.name}</div>
  <h2 class="section-title">Which way?</h2>
  <p class="narrative">Three roads run through ${region.name}, and they are not the same road with different scenery. Pick one and you are on it until the far side.</p>
  <div class="road-list">${cards}</div>`;
}

function renderCombat(){
  const c = state.combat;
  // Enemies are drawn on the persistent stage above, not here — that is what
  // lets them be clicked, flash when hit and animate without this panel's
  // re-render wiping them.
  let actionPanel = '';
  if(c.playing){
    actionPanel = `<div class="actor-banner">Resolving…</div>
      <div class="btn-row"><button class="btn" onclick="skipPlayback()">Skip to the end of the turn</button></div>`;
  } else if(c.result==='win'){
    const r = c.rewardSummary || {exp:0,gold:0,drop:null};
    const lvlUps = state.party.filter(p=>p.lastLevelUps && p.lastLevelUps.length).map(p=>`${p.name} reached level ${p.lastLevelUps[p.lastLevelUps.length-1]}!`);
    state.party.forEach(p=>p.lastLevelUps=[]);
    const dropLine = !r.drop ? '' :
      r.drop.kind==='equipped' ? `<p>✦ ${r.drop.charName} found a <strong>${r.drop.itemName}</strong> and equips it!</p>` :
      `<p>✦ ${r.drop.charName} found a <strong>${r.drop.itemName}</strong>, but had better already — sold it for ${r.drop.gold}g.</p>`;
    actionPanel = `<div class="card"><div class="card-title">Victory</div><p>The party earns ${r.exp} experience and ${r.gold} gold.</p>${dropLine}${lvlUps.length?`<p>${lvlUps.join('<br>')}</p>`:''}</div>
      <div class="btn-row"><button class="btn btn-primary btn-wide" onclick="continueAfterCombat()">Continue</button></div>`;
  } else if(c.result==='lose'){
    actionPanel = `<div class="card"><div class="card-title">Defeat</div><p>The party has fallen. Your journey ends here — but another hero can always be called.</p></div>
      <div class="btn-row"><button class="btn btn-primary btn-wide" onclick="endRunInDefeat()">Continue</button></div>`;
  } else if(state.pendingActionChoice){
    const action = state.pendingActionChoice;
    if(action.kind==='item'){
      const aliveAllies = c.allies.filter(isAlive);
      actionPanel = `<div class="actor-banner">${dispName(c.pendingActor)} — using ${action.name}</div>
      <div class="btn-row">${aliveAllies.map(a=>`<button class="btn" onclick="combatChooseTarget('${a.id}')">${a.name} (${a.hp}/${a.maxHp} HP)</button>`).join('')}</div>
      <div class="btn-row"><button class="btn" onclick="combatCancelChoice()">Back</button></div>`;
    } else if(action.target==='singleAlly'){
      const aliveAllies = c.allies.filter(isAlive);
      actionPanel = `<div class="actor-banner">${dispName(c.pendingActor)} — ${action.name}</div>
      <div class="btn-row">${aliveAllies.map(a=>`<button class="btn" onclick="combatChooseTarget('${a.id}')">${a.name} (${a.hp}/${a.maxHp} HP)</button>`).join('')}</div>
      <div class="btn-row"><button class="btn" onclick="combatCancelChoice()">Back</button></div>`;
    } else if(action.target==='singleDeadAlly'){
      const deadAllies = c.allies.filter(a=>a.hp<=0);
      actionPanel = `<div class="actor-banner">${dispName(c.pendingActor)} — ${action.name}</div>
      <div class="btn-row">${deadAllies.map(a=>`<button class="btn" onclick="combatChooseTarget('${a.id}')">${a.name} (fallen)</button>`).join('')}</div>
      <div class="btn-row"><button class="btn" onclick="combatCancelChoice()">Back</button></div>`;
    } else {
      actionPanel = `<div class="actor-banner">${dispName(c.pendingActor)} — ${action.name}</div><p>Choose a target above.</p>
      <div class="btn-row"><button class="btn" onclick="combatCancelChoice()">Back</button></div>`;
    }
  } else if(c.pendingActor){
    const actor = c.pendingActor;
    const skills = getCharacterSkills(actor);
    const hasDeadAlly = c.allies.some(a=>a.hp<=0);
    actionPanel = `<div class="actor-banner">${dispName(actor)}’s turn (${actor.hp}/${actor.maxHp} HP, ${actor.mp}/${actor.maxMp} MP)</div>
    <div class="btn-row">
      <button class="btn skill-btn" onclick="combatChooseAction('basic')">Attack<small>Physical, no MP</small></button>
      ${skills.map((s,i)=>{
        const affordable = actor.mp>=s.mp;
        const needsDead = s.target==='singleDeadAlly';
        const disabled = !affordable || (needsDead && !hasDeadAlly);
        const scale = skillScalingLabel(s);
        return `<button class="btn skill-btn" ${disabled?'disabled':''} onclick="combatChooseAction('skill', ${i})">${s.name}${s.upgraded?' +'+s.upgraded:''}<small>${s.mp} MP${scale?' — '+scale:''} — ${s.desc}</small></button>`;
      }).join('')}
      <button class="btn" onclick="combatChooseAction('defend')">Defend<small>Halve incoming damage</small></button>
      ${Object.keys(CONSUMABLES).filter(k=>state.inventory[k]>0).map(k=>`<button class="btn" onclick="combatChooseItem('${k}')">${CONSUMABLES[k].name} (${state.inventory[k]})<small>${CONSUMABLES[k].desc}</small></button>`).join('')}
    </div>`;
  }

  return `
  <div class="eyebrow">${renderRegionIntroLabel()} — Round ${c.round-1}</div>
  <div class="combat-grid">
    <div class="log" id="combatLog">${viewLogLines().slice(-10).map(l=>`<div>${l}</div>`).join('')}</div>
    ${actionPanel}
  </div>
  ${combatSpeedControls()}`;
}

// same place as the stats it modifies, because a bonus the player cannot see
// is a bonus that might as well not exist.
function bondRowHtml(c){
  if(c.isLead) return '<p class="bond-line lead">You. Everyone else\u2019s bond is measured against the road walked beside you.</p>';
  const lvl = bondLevel(c);
  const next = bondToNext(c);
  // Derived from the multipliers themselves. Written out by hand these said
  // 8% and 12% for a good while after the numbers had been tuned down to 3%
  // and 5% — the same drift the road cards are built to avoid.
  const pct = m => `${Math.round((m - 1) * 100)}%`;
  const effects = [];
  if(lvl >= 1) effects.push(`+${pct(BOND_ATK_MULT[lvl])} attack and magic`);
  if(lvl >= 2) effects.push(`+${pct(BOND_HP_MULT[lvl])} maximum health`);
  if(lvl >= 3) effects.push(`once a run, gets back up on the road at ${Math.round(BOND_SAVE_PCT*100)}% health`);
  return `<p class="bond-line">
    <span class="bond-pip lv${lvl}">${lvl ? BOND_NUMERAL[lvl] : '\u2014'}</span>
    <strong>${bondLabel(lvl)}</strong>
    ${effects.length ? `<span class="bond-eff">${effects.join(' \u00b7 ')}</span>` : ''}
    <span class="bond-next">${next === null
      ? `${c.battlesTogether || 0} battles at your side`
      : `${next} more ${next === 1 ? 'battle' : 'battles'} together for Bond ${BOND_NUMERAL[lvl+1]}`}</span>
  </p>`;
}
function renderPartyStats(){
  const labels = {hp:'HP',mp:'MP',atk:'Attack',def:'Defense',mag:'Magic',spd:'Speed'};
  const cards = state.party.map(c=>{
    if(c.classId==='hero'){
      // The Hero's points normally arrive via the level-up screen, but they
      // can also be sitting here unspent (a respec at the Trainer, or a
      // level gained while dead). Give them somewhere to go rather than
      // leaving the player to hunt for the screen that grants them.
      const heroPending = c.pendingStatPoints||0;
      return `<div class="card">
        <div class="card-title">${c.name} <span class="tag">Lv.${c.level} — Hero</span></div>
        <p>Fully player-allocated from the start — see the level-up screen for new points as they come in.</p>
        <div class="shop-grid">${Object.keys(labels).map(stat=>`<div class="shop-item"><strong>${labels[stat]}</strong><span>${stat==='hp'?c.maxHp:stat==='mp'?c.maxMp:Math.round(baseStatValue(c,stat))}</span></div>`).join('')}</div>
        <hr class="divider">
        <div class="shop-grid">${equipmentRows(c)}</div>
        ${heroPending>0 ? `<hr class="divider"><p class="tag">Unspent points: ${heroPending}</p><div class="shop-grid">${heroStatRows(c)}</div><div class="btn-row"><button class="btn" onclick="autoAllocateStatPoints('${c.id}')">Auto-Allocate Remaining</button></div>` : ''}
      </div>`;
    }
    const manual = !!c.manualStatsEnabled;
    const pending = c.pendingStatPoints||0;
    return `<div class="card">
      <div class="card-title">${c.name} <span class="tag">Lv.${c.level} — ${c.classDef.name}</span></div>
      ${bondRowHtml(c)}
      ${manual
        ? `<p><span class="tag">Manual allocation enabled</span> — growth was automatic through level ${c.manualModeFrozenAtLevel}, and every level since is yours to spend.</p>`
        : `<p>Growing automatically, same as always. Switch to manual if you want to steer where future levels go — nothing already earned changes.</p>`}
      <div class="shop-grid">${Object.keys(labels).map(stat=>`<div class="shop-item"><strong>${labels[stat]}</strong><span>${stat==='hp'?c.maxHp:stat==='mp'?c.maxMp:Math.round(baseStatValue(c,stat))}</span></div>`).join('')}</div>
      <hr class="divider">
      <div class="shop-grid">${equipmentRows(c)}</div>
      ${manual ? '' : `<div class="btn-row"><button class="btn" onclick="enableManualStats('${c.id}')">Enable manual allocation</button></div>`}
      ${manual && pending>0 ? `<p class="tag">Unspent points: ${pending} (visit again after the next level-up screen, or spend now)</p><div class="shop-grid">${heroStatRows(c)}</div><div class="btn-row"><button class="btn" onclick="autoAllocateStatPoints('${c.id}')">Auto-Allocate Remaining</button></div>` : ''}
    </div>`;
  }).join('');
  return `
  <div class="eyebrow">Party Stats</div>
  <h2 class="section-title">Manage Your Party</h2>
  <p>See how each ally has grown. By default everyone follows their class's normal progression — enable manual allocation on anyone you'd rather steer yourself.</p>
  ${cards}
  <div class="btn-row"><button class="btn btn-primary btn-wide" onclick="state.screen='town'; render();">Back to town</button></div>`;
}
function renderGuildScreen(){
  const isFull = state.party.length >= MAX_PARTY;
  const recruitSection = state.guildRecruitUsed
    ? `<p class="narrative">You've already brought someone new aboard this visit — the board is empty until your next stop.</p>`
    : state.guildPendingRecruitClass
    ? (() => {
        const cls = CLASSES[state.guildPendingRecruitClass];
        // The lead is excluded by identity, not by class. Filtering on
        // classId!=='hero' only protected a party led by the Hero; a run
        // started as a Warrior could dismiss its own player character.
        const dismissable = state.party.filter(p=>!p.isLead && p.classId!=='hero');
        return `<p class="narrative">Your party is full — who makes room for the ${cls.name}?</p>
          <div class="shop-grid">${dismissable.map(p=>`
            <div class="shop-item">
              <strong>${p.name}</strong><span>Lv.${p.level} ${p.classDef.name}</span>
              ${bondLevel(p) ? `<span class="bond-cost">${bondLabel(bondLevel(p))} — sending them away drops it to ${bondLevel(p) > 1 ? bondLabel(bondLevelFor(bondAfterParting(p))) : 'nothing'}</span>` : ''}
              <button class="btn btn-danger" onclick="dismissAndRecruit('${p.id}')">Dismiss &amp; Recruit</button>
            </div>`).join('')}
          </div>
          <div class="btn-row"><button class="btn" onclick="cancelDismissRecruit()">Never mind</button></div>`;
      })()
    : (state.guildRecruitOptions||[]).length===0
    ? `<p class="narrative">No adventurers of a new class are looking for work right now.</p>`
    : `<div class="shop-grid">${state.guildRecruitOptions.map(cid=>{
        const cls = CLASSES[cid];
        return `<div class="shop-item">
          <strong>${cls.name}</strong><span>${cls.blurb}</span>
          <span class="price">${GUILD_RECRUIT_COST}g</span>
          <button class="btn" ${state.gold<GUILD_RECRUIT_COST?'disabled':''} onclick="guildRecruit('${cid}')">${isFull?'Recruit (dismiss someone)':'Recruit'}</button>
        </div>`;
      }).join('')}</div>`;
  const missionSection = state.legIndex>=3
    ? `<p class="narrative">"You should be preparing to face the Demon Lord, not taking on side work," the guild clerk says, closing the ledger. "There'll be no jobs posted here — not with the castle this close."</p>`
    : state.guildMissionUsed
    ? `<p class="narrative">You've already taken a job here this visit — check back at the next town.</p>`
    : `<div class="shop-grid">${(state.guildMissionOptions||[]).map(m=>{
        const region = REGIONS[m.regionId];
        return `<div class="shop-item">
          <div><span class="tag">${m.label}</span><span class="tag">${m.encounterCount} encounter${m.encounterCount>1?'s':''}</span></div>
          <strong>${region.name}</strong><span>${region.blurb}</span>
          <span class="price">~${estimateMissionGold(m)}g + a chance of gear</span>
          <button class="btn" onclick="startGuildMission('${m.id}')">Depart</button>
        </div>`;
      }).join('')}</div>`;
  return `
  <div class="eyebrow">The Adventurers' Guild</div>
  <h2 class="section-title">Notice Board</h2>
  <h2 class="section-title" style="font-size:1.05rem;margin-top:0.6rem">Recruits</h2>
  ${recruitSection}
  <hr class="divider">
  <h2 class="section-title" style="font-size:1.05rem">Available Jobs</h2>
  <p>Take on one job — a short side venture of its own encounters, then straight back here before you continue the road.</p>
  ${missionSection}
  <div class="btn-row"><button class="btn btn-primary btn-wide" onclick="state.screen='town'; render();">Back to town</button></div>`;
}
function renderTrainerScreen(){
  const cards = state.party.map(c=>{
    const known = getCharacterSkills(c);
    const knownRows = known.map(s=>{
      const upLvl = (c.skillUpgrades && c.skillUpgrades[s.name]) || 0;
      const maxed = upLvl>=MAX_SKILL_UPGRADES;
      const cost = maxed ? null : SKILL_UPGRADE_COST[upLvl];
      return `<div class="shop-item">
        <div><span class="tag">${['heal','healAll','revive','buffParty','taunt'].includes(s.kind)?'support':'combat'}</span>${upLvl?`<span class="tag">+${upLvl} trained</span>`:''}</div>
        <strong>${s.name}</strong><span>${s.desc}</span>
        ${skillScalingLabel(s) ? `<span class="tag">${skillScalingLabel(s)}</span>` : ''}
        ${maxed ? '<span class="price">Fully trained</span>' :
          `<span class="price">${cost}g — Upgrade (+15% power, -1 MP)</span>
           <button class="btn" ${state.gold<cost?'disabled':''} onclick="trainUpgradeSkill('${c.id}','${s.name}')">Train</button>`}
      </div>`;
    }).join('');
    const lockedSkills = c.classDef.skills.filter(s=>c.level<s.level && !(c.trainedSkills||[]).includes(s.name));
    const lockedRows = lockedSkills.map(s=>{
      const cost = SKILL_UNLOCK_COST[s.level];
      return `<div class="shop-item">
        <div><span class="tag">unlocks at Lv.${s.level}</span>${skillScalingLabel(s)?`<span class="tag">${skillScalingLabel(s)}</span>`:''}</div>
        <strong>${s.name}</strong><span>${s.desc}</span>
        <span class="price">${cost}g — learn early</span>
        <button class="btn" ${state.gold<cost?'disabled':''} onclick="trainUnlockSkill('${c.id}','${s.name}')">Train</button>
      </div>`;
    }).join('');
    const bonus = BONUS_SKILLS[c.classId];
    const bonusRow = (!bonus || c.bonusSkillLearned) ? '' : `<div class="shop-item">
        <div><span class="tag">bonus skill</span></div>
        <strong>${bonus.name}</strong><span>${bonus.desc}</span>
        <span class="price">${BONUS_SKILL_COST}g — never unlocked by leveling</span>
        <button class="btn" ${state.gold<BONUS_SKILL_COST?'disabled':''} onclick="trainLearnBonus('${c.id}')">Train</button>
      </div>`;
    const heroCrossClassRows = c.classId!=='hero' ? '' : heroSkillsRemainingAtTrainer(c).map(({tier,option})=>{
      const cost = SKILL_UNLOCK_COST[tier];
      const reached = c.level >= tier;
      return `<div class="shop-item">
        <div><span class="tag">Lv.${tier} — ${option.className}${reached?'':' (early)'}</span>${option.skills.map(s=>skillScalingLabel(s)).filter(Boolean).map(l=>`<span class="tag">${l}</span>`).join('')}</div>
        <strong>${option.skills.map(s=>s.name).join(' + ')}</strong><span>${option.skills.map(s=>s.desc).join(' ')}</span>
        <span class="price">${cost}g</span>
        <button class="btn" ${state.gold<cost?'disabled':''} onclick="heroLearnExtraSkill('${c.id}',${tier},'${option.classId}')">Train</button>
      </div>`;
    }).join('');
    const totalAllocated = c.allocatedStats ? Object.values(c.statSpent||{}).reduce((a,b)=>a+b,0) : 0;
    const respecSection = totalAllocated<=0 ? '' : (() => {
      const cost = respecCost(c);
      const pendingRows = c.pendingStatPoints>0 ? `<p class="tag">Points to place: ${c.pendingStatPoints}</p><div class="shop-grid">${heroStatRows(c)}</div>` : '';
      return `<hr class="divider">
        <h2 class="section-title">Respec</h2>
        <p>Refund every point put into ${c.name}’s stats so far (${totalAllocated} total) to reallocate from scratch.</p>
        <div class="btn-row"><button class="btn btn-danger" ${state.gold<cost?'disabled':''} onclick="respecCharacter('${c.id}')">Respec (${cost}g)</button></div>
        ${pendingRows}`;
    })();
    return `<div class="card">
      <div class="card-title">${c.name} <span class="tag">Lv.${c.level}</span></div>
      <div class="shop-grid">${knownRows}${lockedRows}${bonusRow}${heroCrossClassRows}</div>
      ${respecSection}
    </div>`;
  }).join('');
  return `
  <div class="eyebrow">The Trainer</div>
  <h2 class="section-title">Sharpen Your Craft</h2>
  <p>Gold buys skill, not just steel — train a skill early, push a known move further, or learn something the road alone won’t teach.</p>
  ${cards}
  <div class="btn-row"><button class="btn btn-primary btn-wide" onclick="state.screen='town'; render();">Back to town</button></div>`;
}

/* =========================================================
   INIT
   ========================================================= */
function renderLoading(pct){
  const app = document.getElementById('app');
  if(!app) return;
  app.innerHTML = `<div class="codex-inner">
    <div class="eyebrow">Veilfall</div>
    <h2 class="section-title">Gathering the world…</h2>
    <p class="narrative">The Goddess is still painting the horizon.</p>
    <div class="bar-track" style="height:10px"><div class="bar-fill hp" style="width:${pct}%"></div></div>
  </div>`;
}
// With an empty manifest this is a straight render — the loading screen only
// appears once there is art to wait for. A file that fails to load is counted
// and skipped rather than blocking the boot: a missing sprite should cost you
// a placeholder, not the game.
function bootGame(){
  const total = Object.keys(ASSET_MANIFEST.sprites).length + Object.keys(ASSET_MANIFEST.backgrounds).length;
  if(!HAS_DOM || total===0){ render(); return; }
  renderLoading(0);
  preloadAssets((done, all)=>renderLoading(Math.round(done/all*100))).then(res=>{
    if(res.failed) console.warn('Veilfall: ' + res.failed + ' asset(s) could not be loaded; those units fall back to placeholders.');
    render();
  });
}
newGame();
bootGame();
</script>
<script>
/* Offline support. Registered only when served over http(s) — opening the
   file straight from disk keeps working exactly as before, just without the
   offline cache. */
(function(){
  if(!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(e){
      console.warn('Veilfall: offline cache unavailable', e);
    });
    // Ask the browser not to evict saves under storage pressure. Home-screen
    // apps on iOS are already exempt from Safari's 7-day storage cap; this
    // covers everything else. Harmless if refused.
    if(navigator.storage && navigator.storage.persist){
      navigator.storage.persist().catch(function(){});
    }
  });
})();
</script>

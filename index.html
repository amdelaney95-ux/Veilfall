  const base = tier===1 ? 2 : (2 + (Math.random()<0.5?1:0));
  const baseEvents = tier===1 ? 1 : (1 + (Math.random()<0.5?1:0));
  // At least one fight on any road at any tier: a leg that is only events and
  // a boss skips the levelling the boss was tuned against.
  const regularCount = Math.max(1, base + (road ? road.encounters : 0));
  const eventCount = Math.max(0, baseEvents + (road ? road.events : 0));
  let nodes = [];
  for(let i=0;i<regularCount;i++) nodes.push({type:'encounter'});
  for(let i=0;i<eventCount;i++) nodes.push({type:'event', eventKind:choice(EVENT_KINDS)});
  nodes = shuffle(nodes);
  nodes.push({type:'boss'});
  return nodes;
}

/* =========================================================
   COMBAT ENGINE
   ========================================================= */
// A held beat before a boss.
//
// All of this already existed and was only ever pointed at the ending: the
// stage knows how to show a full 380x214 plate, and it knows how to composite
// a sprite into one. A boss intro is that same plate with one figure in it
// instead of six, so the whole feature is a screen, a table of epithets and
// four lines in updateBattleStage().
//
// The enemies are built BEFORE the beat and held on `state.bossIntro`, so the
// fight the player is looking at is the fight they get. `bossIntro` is not a
// save-safe screen, which is what keeps those live objects out of a save file.
function bossIntroThen(enemies, context, scene, spriteKey, eyebrow, title, epithet, cta){
  state.bossIntro = {enemies, context, scene, spriteKey, eyebrow, title, epithet, cta};
  state.screen = 'bossIntro';
  render();
}
function beginBossFight(){
  const b = state.bossIntro;
  if(!b) return;
  state.bossIntro = null;
  startCombat(b.enemies, b.context);
  render();
}
function startCombat(enemies, context){
  // A pending playback timer from a previous fight would otherwise wake up
  // and start stepping this one's timeline.
  if(state.combat && state.combat.timer) clearTimeout(state.combat.timer);
  state.combat = {
    // Every party member joins the combat, the fallen included — Revive
    // needs them present as targets. (Previously written as a filter with an
    // always-true predicate, which read like a half-finished condition.)
    enemies, allies: state.party.slice(),
    round:1, turnQueue:[], turnIndex:0, log:[], pendingActor:null, result:null, context,
    timeline:[], view:null, playing:false, timer:null
  };
  state.party.forEach(p=>{ p.defending=false; });
  state.battlesFought = (state.battlesFought||0) + 1;
  state.lastCombatContext = context;
  bestiarySee(enemies.map(bestiaryKeyFor));
  beginTurnBatch();
  log(`— The battle begins —`);
  beginRound();
  runCombatLoop();
  state.screen='combat';
  presentTimeline();
}
function beginRound(){
  const c = state.combat;
  c.round++;
  const combined = [...c.allies.filter(isAlive), ...c.enemies.filter(isAlive)];
  // A phase-2 Demon Lord acts twice per round — a real escalation (more
  // total actions, more chances to use its specials) rather than just
  // bigger numbers on the same single action.
  c.enemies.filter(isAlive).forEach(e=>{ if(e.role==='demonlord' && e.phase===2) combined.push(e); });
  c.turnQueue = combined.sort((a,b)=> getStat(b,'spd') - getStat(a,'spd'));
  c.turnIndex = 0;
  // Cleared every round: actor id -> whether that actor's status tick told it
  // to skip. An actor queued more than once (a phase-2 Demon Lord) must tick
  // its statuses only on its first entry, but must honour a stun for every
  // entry in the round.
  c.roundTick = new Map();
  fx({t:'round', n:c.round-1});
}
function tickStatusesStartOfTurn(actor){
  actor.defending = false;
  let skip = false;
  const remaining = [];
  (actor.statuses||[]).forEach(s=>{
    // Event buffs are measured in battles, not turns — tickEventBuffsAfterBattle()
    // owns their lifetime. Letting them fall through to the duration countdown
    // below set their (undefined) duration to NaN, which failed the >0 test and
    // dropped them on the holder's very first turn: a shrine blessing sold as
    // lasting two battles was silently gone before it changed a single roll.
    if(s.kind==='eventBuff'){ remaining.push(s); return; }
    if(s.kind==='dot'){
      const dmg = Math.max(1, Math.round((actor.maxHp||getStat(actor,'hp')||1) * s.dmgPct));
      fx({t:'dot', id:actor.id, amount:dmg, label:s.label});
      applyDamage(actor, dmg, true);
      log(`${dispName(actor)} suffers ${dmg} damage from ${s.label.toLowerCase()}.`);
    }
    if(s.kind==='stun'){ skip = true; fx({t:'stun', id:actor.id, label:s.label}); log(`${dispName(actor)} is ${s.label.toLowerCase()} and cannot act!`); }
    s.duration--;
    if(s.duration>0) remaining.push(s);
  });
  actor.statuses = remaining;
  return skip;
}
function applyStatus(target, statusDef){
  if(!target || target.hp<=0) return;
  target.statuses = (target.statuses||[]).filter(s=>s.key!==statusDef.key);
  target.statuses.push({key:statusDef.key, label:statusDef.label, kind:statusDef.kind, stat:statusDef.stat, mult:statusDef.mult, dmgPct:statusDef.dmgPct, duration:statusDef.duration});
  fx({t:'status', id:target.id, label:statusDef.label});
}
function checkCombatEnd(){
  const c = state.combat;
  if(c.enemies.every(e=>e.hp<=0)){
    if(!c.result){ c.result='win'; awardRewards(); bestiarySlay(c.enemies.map(bestiaryKeyFor)); deepenBonds(); }
    return true;
  }
  if(c.allies.every(a=>a.hp<=0)){ c.result='lose'; return true; }
  return false;
}
function applyDamage(target, dmg, isDot){
  target.hp -= dmg;
  let died = false, guarded = false;
  if(target.hp<=0){
    // Bond III fires ONCE A RUN, for the whole party — not once a battle, and
    // not once per companion. The measurements are why:
    //
    //   bonds off                                60.6%
    //   + 8% attack and 12% health on companions 72.5%   (+11.9)
    //   + the save, once a run per companion     82.8%   (+10.3)
    //
    // Two thirds of a save a run was still worth ten points, because a save
    // only ever matters in a fight that was about to be lost — which is the
    // definition of the fights that decide a run. One a run, party-wide, is
    // what the number could bear.
    //
    // It resolves before the guardian blessing deliberately. Both are
    // once-a-run saves now, and this one leaves the character on a usable
    // fraction of their health rather than the blessing's single point.
    if(!target.isEnemy && bondLevel(target) >= BOND_SAVE_LEVEL && !state.bondSaveSpent && bondSaveAllowedHere()){
      state.bondSaveSpent = true;
      target.bondSaveUsed = true;
      target.hp = Math.max(1, Math.round(target.maxHp * BOND_SAVE_PCT));
      guarded = true;
      log(`✦ ${dispName(target)} has come too far with you to stop here — and gets back up.`);
    } else if(!target.isEnemy && state.blessing==='guardian' && !state.usedGuardianAngel){
      state.usedGuardianAngel = true; target.hp = 1; guarded = true;
      log(`✦ A guardian light shields ${dispName(target)} from the killing blow!`);
    } else {
      target.hp = 0; died = true;
      if(!isDot) log(`${dispName(target)} ${target.isEnemy?'is defeated':'has fallen'}!`);
    }
  }
  // Emitted after the maths, so the bar the player sees always matches the
  // number that was actually applied — including the guardian-angel save.
  fx({t:'hp', id:target.id, hp:target.hp});
  if(guarded) fx({t:'guardian', id:target.id});
  if(died) fx({t:'death', id:target.id});
}
// Safety valve: no single blow against a player character may exceed this,
// however the stat maths worked out. A hit can still be frightening, just
// never lethal on its own from full health.
//
// Measured against the PARTY'S AVERAGE pool, not the target's own. Using the
// target's own maximum made the valve perverse — the bigger your health pool,
// the more absolute damage every blow was permitted to do, so the character
// built to absorb hits absorbed more damage than anyone it was protecting.
// That one line was why defence, armour, Defend and the Warrior itself were
// worth so little, and why the Demon Lord fight ignored the damage model
// entirely (it capped 88% of hits, against 0% everywhere else in the game).
function damageCapFor(target, isAoe){
  const pct = isAoe ? MAX_HIT_PCT_OF_MAXHP_AOE : MAX_HIT_PCT_OF_MAXHP_SINGLE;
  const party = (state && state.party && state.party.length) ? state.party : [target];
  const ref = party.reduce((a,p)=>a+(p.maxHp||0),0) / party.length;
  return Math.max(1, Math.ceil((ref || target.maxHp) * pct));
}
function dealDamage(attacker, target, action, isAoe){
  if(!target || target.hp<=0) return;
  const school = action.school||'phys';
  const atkStat = school==='mag' ? getStat(attacker,'mag') : getStat(attacker,'atk');
  const defStat = getStat(target,'def');
  const defFactor = school==='mag'?0.3:0.5;
  let power = action.power||1;
  if(action.bonusVsFullHp && target.hp>=target.maxHp) power += action.bonusVsFullHp;
  if(action.executePct && target.hp <= target.maxHp*action.executePct) power = action.executePower;
  if(attacker.isEnemy && isAoe) power *= ENEMY_AOE_DAMAGE_MULT;
  let dmg = Math.max(1, atkStat*power - defStat*defFactor);
  dmg *= (0.85 + Math.random()*0.3);
  const critChance = 0.05 + (state.blessing==='lucky'?0.15:0) + (action.critBonus||0);
  const isCrit = Math.random() < critChance;
  if(isCrit) dmg *= 1.5;
  if(target.defending) dmg *= 0.5;
  // Braced behind the shield: blows a character has deliberately pulled onto
  // themselves land softer than they would on whoever was standing there.
  if((target.statuses||[]).some(st=>st.kind==='taunt')) dmg *= TAUNT_DAMAGE_TAKEN;
  dmg = Math.max(1, Math.round(dmg));
  if(!target.isEnemy) dmg = Math.min(dmg, damageCapFor(target, isAoe));
  fx({t:'hit', actorId:attacker.id, targetId:target.id, amount:dmg, crit:isCrit});
  applyDamage(target, dmg);
  log(`${dispName(attacker)} uses ${action.name} on ${dispName(target)} for ${dmg} damage${isCrit?' — critical!':''}.`);
  // `debuff` is accepted as well as `statusEffect` on purpose: Weaken was
  // authored with the rider under `debuff`, this lookup only read
  // `statusEffect`, and the skill spent six levels dealing 0.4 power damage
  // and applying nothing at all. Reading both means a future skill written
  // with either spelling still works.
  const rider = action.statusEffect || action.debuff;
  if(rider && target.hp>0){
    // Losing an entire turn is categorically stronger than chip damage or a
    // stat shave, and a lone boss that can be frozen over and over stops
    // being a fight. Bosses resist stuns specifically — damage-over-time and
    // stat debuffs still land at full rate, so debuff-flavoured kits keep
    // working against them.
    let riderChance = rider.chance ?? 1;
    if(rider.kind==='stun' && BOSS_ROLES.includes(target.role)) riderChance *= BOSS_STUN_RESIST;
    if(Math.random() < riderChance){
      applyStatus(target, rider);
      log(`${dispName(target)} is afflicted with ${rider.label}.`);
    }
  }
}
function healTarget(caster, target, action, silent){
  if(!target || target.hp<=0) return;
  const amount = Math.round(getStat(caster,'mag')*(action.power||1) + 5);
  target.hp = Math.min(target.maxHp, target.hp+amount);
  fx({t:'healed', targetId:target.id, amount});
  fx({t:'hp', id:target.id, hp:target.hp});
  if(action.clearsDebuffs) target.statuses = (target.statuses||[]).filter(s=>s.kind!=='debuff' && s.kind!=='dot');
  if(!silent) log(`${dispName(caster)} uses ${action.name} on ${dispName(target)}, restoring ${amount} HP.`);
}
function reviveTarget(caster, target, action){
  if(!target || target.hp>0) return;
  target.hp = Math.max(1, Math.round(target.maxHp*0.4));
  fx({t:'revive', id:target.id});
  fx({t:'hp', id:target.id, hp:target.hp});
  log(`${dispName(caster)} uses ${action.name} — ${dispName(target)} returns to the fight!`);
}
// What an action is aimed at, for the stage to draw it. Resolution itself
// does not use this; it only tells the effects where to go.
function castTargetIds(actor, action, target){
  const c = state.combat;
  if(!c) return [];
  switch(action.kind){
    case 'aoeAttack': return (actor.isEnemy ? c.allies : c.enemies).filter(isAlive).map(u=>u.id);
    case 'healAll': case 'buffParty': return c.allies.filter(isAlive).map(u=>u.id);
    case 'taunt': case 'defend': return [actor.id];
    default: return target ? [target.id] : [];
  }
}
function resolveAction(actor, action, target){
  if(action.kind!=='defend'){
    fx({t:'cast', actorId:actor.id, targetIds:castTargetIds(actor, action, target),
        name:action.name || 'Attack', kind:action.kind, item:action.item});
  }
  if(action.kind==='defend'){ actor.defending=true; fx({t:'defend', id:actor.id}); log(`${dispName(actor)} braces for the next attack.`); return; }
  if(action.kind==='item'){ resolveItem(actor, action, target); return; }
  if(action.mp){ actor.mp = Math.max(0, actor.mp - action.mp); fx({t:'mp', id:actor.id, mp:actor.mp}); }
  const c = state.combat;
  switch(action.kind){
    case 'attack': dealDamage(actor, target, action); break;
    case 'aoeAttack': {
      const pool = actor.isEnemy ? c.allies.filter(isAlive) : c.enemies.filter(isAlive);
      pool.forEach(t=>dealDamage(actor,t,action,true));
      break;
    }
    case 'heal': healTarget(actor, target, action); break;
    case 'healAll': c.allies.filter(isAlive).forEach(t=>healTarget(actor,t,action,false)); break;
    case 'buffParty': c.allies.filter(isAlive).forEach(t=>applyStatus(t, action.buff)); log(`${dispName(actor)} uses ${action.name}!`); break;
    case 'taunt':
      applyStatus(actor, action.status);
      log(`${dispName(actor)} roars a challenge — the enemy's attention swings around.`);
      break;
    case 'debuffEnemy': if(target){ dealDamage(actor,target,action); } break;
    case 'revive': reviveTarget(actor, target, action); break;
  }
  if(action.selfDamagePct){
    const recoil = Math.max(1, Math.round(actor.maxHp*action.selfDamagePct));
    applyDamage(actor, recoil, true);
    log(`${dispName(actor)} strains from the effort, taking ${recoil} damage.`);
  }
  // demon lord phase transition check
  if(target && target.isEnemy && target.role==='demonlord' && target.phase===1 && target.hp <= target.maxHp*0.5 && target.hp>0){
    target.phase = 2;
    bestiarySee(['demonlord_2']);
    target.atk = Math.round(target.atk*1.25);
    target.specials.push({name:'Despair Wave',kind:'aoeAttack',school:'mag',power:1.2,chance:0.35});
    fx({t:'phase', id:target.id});
    const summoned = makeDemonLordSummons();
    summoned.forEach(sm=>{
      state.combat.enemies.push(sm);
      // Kept off the stage until the summon beat actually plays, so they do
      // not appear before the line announcing them.
      if(state.combat.view) state.combat.view.hidden[sm.id] = true;
    });
    log(`✦ The Demon Lord’s wounds knit with dark power — it grows more dangerous!`);
    fx({t:'summon', ids:summoned.map(sm=>sm.id)});
    log(`✦ Two Abyssal Wraiths tear their way out of the dark to defend their master!`);
  }
}
function resolveItem(actor, action, target){
  const key = action.item;
  if(state.inventory[key]<=0) return;
  state.inventory[key]--;
  if(key==='potion'){ const b=target.hp; target.hp = Math.min(target.maxHp, target.hp+35); fx({t:'healed', targetId:target.id, amount:target.hp-b}); fx({t:'hp', id:target.id, hp:target.hp}); log(`${dispName(actor)} uses a Potion on ${dispName(target)}, restoring 35 HP.`); }
  if(key==='ether'){ target.mp = Math.min(target.maxMp, target.mp+20); fx({t:'mp', id:target.id, mp:target.mp}); log(`${dispName(actor)} uses an Ether on ${dispName(target)}, restoring 20 MP.`); }
  if(key==='elixir'){ const b=target.hp; target.hp=target.maxHp; target.mp=target.maxMp; fx({t:'healed', targetId:target.id, amount:target.hp-b}); fx({t:'hp', id:target.id, hp:target.hp}); fx({t:'mp', id:target.id, mp:target.mp}); log(`${dispName(actor)} uses an Elixir on ${dispName(target)} — fully restored!`); }
}
function enemyDecideAction(enemy){
  const c = state.combat;
  const aliveAllies = c.allies.filter(isAlive);
  let target = Math.random()<0.4
    ? aliveAllies.reduce((a,b)=> (a.hp/a.maxHp) < (b.hp/b.maxHp) ? a : b)
    : choice(aliveAllies);
  // A taunt overrides whatever the enemy had picked. Applied after the normal
  // choice rather than instead of it, so removing the taunt restores the old
  // behaviour exactly. Note this only diverts single-target attacks — the AOE
  // branch below discards the target entirely, which is the intended limit on
  // how much a taunt can protect the party.
  const taunters = aliveAllies.filter(a=>(a.statuses||[]).some(st=>st.kind==='taunt'));
  if(taunters.length && Math.random() < TAUNT_REDIRECT_CHANCE) target = choice(taunters);
  let action = {name:'Attack', kind:'attack', school:'phys', power:1.0, mp:0};
  // Rolled in order, first hit wins. This used to be a forEach that simply
  // assigned on every passing roll, so a later special silently overrode an
  // earlier one — the first special in the list only ever fired when every
  // special after it missed, landing well under its declared chance.
  const specials = enemy.specials || [];
  for(let i=0;i<specials.length;i++){
    if(Math.random() < specials[i].chance){ action = specials[i]; break; }
  }
  if(action.kind==='aoeAttack') target = null;
  return {action, target};
}
function runCombatLoop(){
  const c = state.combat;
  while(true){
    if(checkCombatEnd()) return;
    if(c.turnIndex >= c.turnQueue.length){ beginRound(); if(c.turnQueue.length===0) return; continue; }
    const actor = c.turnQueue[c.turnIndex];
    if(!isAlive(actor)){ c.turnIndex++; continue; }
    // A phase-2 Demon Lord is queued twice so that it genuinely acts twice.
    // Ticking statuses on both entries halved the duration of every debuff
    // placed on it and doubled every damage-over-time effect, so the tick is
    // resolved once per round and its skip decision reused.
    if(!c.roundTick) c.roundTick = new Map();
    let skip;
    if(c.roundTick.has(actor.id)){
      actor.defending = false;
      skip = c.roundTick.get(actor.id);
    } else {
      skip = tickStatusesStartOfTurn(actor);
      c.roundTick.set(actor.id, skip);
    }
    if(checkCombatEnd()) return;
    if(skip){ c.turnIndex++; continue; }
    if(actor.isEnemy){
      fx({t:'turn', id:actor.id});
      const {action, target} = enemyDecideAction(actor);
      resolveAction(actor, action, target);
      c.turnIndex++;
      continue;
    } else {
      c.pendingActor = actor;
      return;
    }
  }
}
function awardRewards(){
  const c = state.combat;
  const isMission = c.context==='guildMission';
  const tier = state.travel ? state.travel.tier : isMission ? state.legIndex : (c.context==='castleGauntlet' || c.context==='demonlord' ? 3 : 1);
  let exp = 0, gold = 0, hadBoss = false;
  c.enemies.forEach(e=>{
    const isBoss = e.role==='boss' || e.role==='demonlord';
    if(isBoss) hadBoss = true;
    exp += Math.round((isBoss?EXP_PER_BOSS:EXP_PER_REGULAR) * tier);
    gold += Math.round((isBoss?GOLD_PER_BOSS:GOLD_PER_REGULAR) * tier * (0.85+Math.random()*0.3));
  });
  if(isMission){
    exp = Math.round(exp * MISSION_EXP_MULT);
    gold = Math.round(gold * state.guildMission.goldMult);
  }
  const road = currentRoute();
  if(road){
    exp = Math.round(exp * road.expMult);
    gold = Math.round(gold * road.goldMult);
  }
  if(state.blessing==='favor') exp = Math.round(exp*1.25);
  if(state.blessing==='golden') gold = Math.round(gold*1.5);
  const living = state.party.filter(p=>p.hp>0);
  const share = Math.max(1, Math.floor(exp/Math.max(1,living.length)));
  living.forEach(p=>gainExp(p, share));
  applyLevelGapCatchup();
  state.gold += gold;
  // Gear drops — leg regions and guild missions only (not the castle),
  // scaled to the town's current tier: Leg I -> tier-1 gear, Leg II ->
  // tier-2, Leg III -> tier-3. Demi-bosses roll at a much higher chance.
  let drop = null;
  if((state.travel || isMission) && living.length){
    const dropChance = Math.min(1, (hadBoss ? DROP_CHANCE_BOSS : DROP_CHANCE_REGULAR)
                                    * (road ? road.dropMult : 1));
    if(Math.random() < dropChance) drop = rollItemDrop(tier, living);
  }
  c.rewardSummary = {exp, gold, drop};
}
function rollItemDrop(tier, livingParty){
  const recipient = choice(livingParty);
  const eq = EQUIP[recipient.classId];
  const useWeapon = Math.random() < 0.5;
  const item = useWeapon ? eq.weapons[tier-1] : eq.armor[tier-1];
  if(!item) return null;
  const isUpgrade = useWeapon
    ? (!recipient.weapon || recipient.weapon.tier < item.tier)
    : (!recipient.armor || recipient.armor.tier < item.tier);
  if(isUpgrade){
    if(useWeapon) recipient.weapon = item; else recipient.armor = item;
    recalcDerived(recipient);
    return {kind:'equipped', charName:recipient.name, itemName:item.name};
  }
  // Already have as good or better — convert to gold instead of a dead drop.
  state.gold += item.price;
  return {kind:'sold', charName:recipient.name, itemName:item.name, gold:item.price};
}
function gainExp(c, amount){
  c.exp += amount;
  const gains = [];
  while(c.level < LEVEL_CAP && c.exp >= EXP_NEED(c.level)){
    c.exp -= EXP_NEED(c.level);
    c.level++;
    recalcDerived(c);
    c.hp = c.maxHp; c.mp = c.maxMp;
    gains.push(c.level);
    if(c.classId==='hero'){
      c.pendingStatPoints = (c.pendingStatPoints||0) + HERO_LEVELUP_POINTS;
      c.statSpentThisBatch = {hp:0,mp:0,atk:0,def:0,mag:0,spd:0};
      if(HERO_SKILL_TIERS.includes(c.level) && !(c.resolvedSkillTiers||[]).includes(c.level)){
        c.pendingSkillTiers = c.pendingSkillTiers||[];
        c.pendingSkillTiers.push(c.level);
      }
    } else if(c.manualStatsEnabled && c.level > (c.manualModeFrozenAtLevel||0)){
      c.pendingStatPoints = (c.pendingStatPoints||0) + classPointsPerLevel(c.classDef);
      c.statSpentThisBatch = {hp:0,mp:0,atk:0,def:0,mag:0,spd:0};
    }
  }
  if(c.level>=LEVEL_CAP) c.exp = 0;
  c.lastLevelUps = gains;
}
function expNeededToReach(fromLevel, toLevel){
  let total = 0;
  for(let lv=fromLevel; lv<toLevel; lv++) total += EXP_NEED(lv);
  return total;
}
// Keeps any party member from falling more than MAX_LEVEL_GAP behind the
// party's current highest level — mainly matters for someone who's died
// and missed several fights' worth of EXP while everyone else kept
// earning it. Still a real cost (they land AT the floor, not level with
// the leader), just a bounded one. Explicitly does not revive a currently
// dead character — gainExp()'s level-up side effect normally restores
// full HP/MP, which would resurrect them for free, so their HP/MP are
// restored to their pre-catch-up (dead) values afterward if they were
// dead going in.
function applyLevelGapCatchup(){
  if(state.party.length<2) return;
  const maxLevel = Math.max(...state.party.map(p=>p.level));
  const floor = maxLevel - MAX_LEVEL_GAP;
  state.party.forEach(p=>{
    if(p.level < floor){
      const wasDead = p.hp<=0;
      const priorMp = p.mp;
      const needed = expNeededToReach(p.level, floor) - p.exp;
      if(needed>0) gainExp(p, needed);
      if(wasDead){ p.hp = 0; p.mp = Math.min(p.maxMp, priorMp); }
    }
  });
}

/* =========================================================
   EVENTS
   ========================================================= */
function buildEvent(kind, tier){
  const region = state.travel ? REGIONS[state.travel.regionId] : null;
  if(kind==='shrine'){
    return {kind, title:'A Forgotten Shrine', text:`Half-swallowed by ${region?region.blurb.toLowerCase():'the wilds'}, a weathered shrine stands quiet. Something in the air asks to be acknowledged.`,
      choices:[
        {label:'Pray at the shrine', resolve(){
          if(Math.random()<0.6){
            state.party.forEach(p=>applyEventBuff(p,{key:'blessed',label:'Emboldened',kind:'buff',stat:'atk',mult:1.15,battles:2}));
            return 'A warmth settles over the party — you feel emboldened for the fights ahead.';
          } else {
            state.party.forEach(p=>applyEventBuff(p,{key:'shaken',label:'Shaken',kind:'buff',stat:'atk',mult:0.9,battles:2}));
            return 'A cold chill runs through you. The shrine was not so welcoming after all.';
          }
        }},
        {label:'Leave it undisturbed', resolve(){ return 'You leave the shrine to its silence and move on.'; }}
      ]};
  }
  if(kind==='merchant'){
    const price = Math.round(35*tier);
    return {kind, title:'A Traveling Merchant', text:'A hooded merchant waves you over, wares glittering despite the road dust. "Rare goods, cheap — for the right traveler."',
      choices:[
        {label:`Buy a Mystery Elixir (${price}g)`, disabled: state.gold<price, resolve(){
          state.gold -= price; state.inventory.elixir += 1;
          return 'The merchant hands over a corked vial that hums faintly. An Elixir joins your supplies.';
        }},
        {label:'Decline and walk on', resolve(){ return 'You nod politely and continue on your way.'; }}
      ]};
  }
  if(kind==='traveler'){
    return {kind, title:'A Cry for Help', text:'Somewhere off the path, a voice cries out — followed by the unmistakable snarl of something hostile.',
      choices:[
        {label:'Investigate', resolve(){
          const enemies = [makeEnemy(state.travel.regionId,'grunt',tier)];
          if(livingPartySize()>=2 && Math.random()<0.5) enemies.push(makeEnemy(state.travel.regionId,'skirmisher',tier));
          state.pendingEventOutcome = {type:'travelerFight'};
          startCombat(enemies, 'event');
          return null;
        }},
        {label:'Keep moving', resolve(){ return 'You decide the risk isn’t worth it, and press on.'; }}
      ]};
  }
  // chest
  return {kind, title:'A Weathered Chest', text:'Half-buried and bound in rusted iron, a chest sits alone. It could hold treasure — or worse.',
    choices:[
      {label:'Open it', resolve(){
        if(Math.random()<0.7){
          const gold = Math.round((20+randInt(20))*tier);
          state.gold += gold;
          if(Math.random()<0.4){ state.inventory.potion += 1; return `Inside: ${gold} gold and a Potion.`; }
          return `Inside: ${gold} gold, nothing more.`;
        } else {
          const enemies = [makeEnemy(state.travel.regionId,'brute',tier)];
          startCombat(enemies, 'event');
          return null;
        }
      }},
      {label:'Leave it be', resolve(){ return 'Some things are better left buried. You walk on.'; }}
    ]};
}
function applyEventBuff(target, def){
  target.statuses = target.statuses||[];
  target.statuses = target.statuses.filter(s=>s.key!==def.key);
  target.statuses.push({key:def.key, label:def.label, kind:'eventBuff', stat:def.stat, mult:def.mult, battlesLeft:def.battles});
}
function tickEventBuffsAfterBattle(){
  state.party.forEach(p=>{
    p.statuses = (p.statuses||[]).filter(s=>{
      if(s.kind==='eventBuff'){ s.battlesLeft--; return s.battlesLeft>0; }
      return true;
    });
  });
}
// A short breather between encounters — not a full rest, but keeps solo/early
// parties from being ground down by pure attrition across a region's nodes.
// What the road itself does to you between one node and the next.
//
// This exists because every other way of making a road dangerous turned out to
// pay for itself. More fights, tougher enemies, an extra escort at the boss —
// each adds enemies, enemies award experience and gold, and across three legs
// those compound into more survivability than the danger removed. Adding one
// skirmisher to every demi-boss made the bold road go from 84% to 92%.
//
// A toll is the one cost with no reward attached. It is a flat fraction of
// maximum health taken after every node, so it is proportionally identical for
// a Warrior and a Healer — unlike a stat multiplier, which punishes whoever was
// already thinnest and collapsed the Healer to a 20% win rate while the Warrior
// sat at 93%. A Healer can heal it back, and pays in MP to do it, which is a
// fair trade rather than a wall.
//
// It is also the only mechanic here that the fiction was already asking for:
// bad air on the Vent Road, fever water in the Black Channel, no shade at all
// on the Glass Flats.
function applyRoadToll(){
  const toll = routeToll();
  if(!toll) return;
  state.party.forEach(p=>{
    if(p.hp<=0) return;
    p.hp = Math.max(1, p.hp - Math.round(p.maxHp * toll));
  });
}
function partialRecover(){
  state.party.forEach(p=>{
    if(p.hp<=0) return;
    // 30%, not 60%. At 60% the road could not accumulate any pressure: no
    // single hit can kill from full HP, town rest is free, and most of a
    // wound was refunded before the next node — legs II and III killed about
    // four parties in 250 runs. This is the lever that gives the middle of
    // the run stakes; buffing enemy stats there barely registers by
    // comparison.
    // The rate is now the ROAD's. 0.30 stays the default and is what guild
    // missions and anything off a road still get; the Duckboards heal you at
    // 0.50 and the bold roads at 0.15, which is most of why they feel the way
    // they do. Nothing else in the game moves the needle this hard.
    const rate = routeRecoverRate();
    p.hp = Math.min(p.maxHp, p.hp + Math.round((p.maxHp-p.hp)*rate));
    p.mp = Math.min(p.maxMp, p.mp + Math.round((p.maxMp-p.mp)*rate));
  });
}

/* =========================================================
   REGION TRAVEL / TOWN FLOW
   ========================================================= */
function startLeg(legNumber, regionId){
  // No nodes yet. The path is built by chooseRoute(), because the road decides
  // how long it is — building one here and patching it afterwards would mean
  // the encounter count and the road could disagree.
  state.travel = { regionId, tier: legNumber, route:null, nodes:[], nodeIndex:0 };
  markStage(legNumber===1 ? 0 : legNumber===2 ? 2 : 4);
  state.screen = 'regionIntro';
}
function advanceRegion(){
  const t = state.travel;
  if(!t) return;
  // A leg whose road has not been chosen yet has no nodes either, and an empty
  // node list is indistinguishable from a finished one. The first version of
  // this feature left that to the button — regionIntro set the screen and the
  // road screen built the path — and anything that called advanceRegion()
  // directly instead fell straight through to arriveAtTown() and skipped the
  // entire region. Every bot driver does exactly that, so the sweep quietly
  // played a game with no road fights in it at all: level 3 at the castle
  // instead of 10, while still reporting all three towns reached.
  //
  // So the check lives HERE, at the one place every path goes through, rather
  // than in the callers. A leg without a road is a leg that has not started.
  if(!t.route){ state.screen = 'routeChoice'; return; }
  if(t.nodeIndex >= t.nodes.length){ arriveAtTown(); return; }
  const node = t.nodes[t.nodeIndex];
  if(node.type==='encounter'){ startCombat(generateEncounter(t.regionId,t.tier), 'region'); }
  else if(node.type==='event'){ state.currentEvent = buildEvent(node.eventKind, t.tier); state.screen='event'; }
  else if(node.type==='boss'){
    const region = REGIONS[t.regionId];
    bossIntroThen(generateBossEncounter(t.regionId,t.tier), 'regionBoss', t.regionId,
                  t.regionId + '_boss', region.name, region.names.boss,
                  BOSS_EPITHETS[t.regionId], 'Meet it');
  }
}
function arriveAtTown(){
  state.legIndex += 1;
  state.travel = null;
  markStage(state.legIndex===1 ? 1 : state.legIndex===2 ? 3 : 5);
  // Every leg — including III — ends at a town. The Leg III town is the
  // last chance to rest and gear up before the castle; its shop naturally
  // carries tier-3 gear since generateShopItems indexes by legIndex.
  state.screen = 'town';
  state.townRecruitOffer = rollRecruitOffer();
  state.townShop = generateShopItems(state.legIndex);
  state.guildRecruitOptions = generateGuildRecruitOptions();
  state.guildRecruitUsed = false;
  state.guildMissionOptions = generateGuildMissionOptions();
  state.guildMissionUsed = false;
  state.guildPendingRecruitClass = null;
}
// Guild recruit board: up to 3 of whichever classes aren't already in the
// party — deliberately not all of them ("multiple, but not all"). This is
// a fully separate offer from the free passive travelerRecruitOffer, with
// its own independent once-per-town cap.
function generateGuildRecruitOptions(){
  const have = state.party.map(p=>p.classId);
  const missing = CLASS_ORDER.filter(c=>!have.includes(c));
  return shuffle(missing).slice(0, Math.min(3, missing.length));
}
// Guild mission board: exactly one of each difficulty tier, each assigned
// a distinct random region theme — gives both a difficulty spread AND
// theme variety across the 3 slots every visit.
function generateGuildMissionOptions(){
  const themes = shuffle(REGION_IDS).slice(0,3);
  return GUILD_MISSION_DIFFICULTIES.map((d,i)=>({
    id: uid(), regionId: themes[i], difficulty: d.key, label: d.label,
    tierMult: d.tierMult, encounterCount: d.encounterCount, goldMult: d.goldMult
  }));
}
function generateShopItems(legIndex){
  const items = [];
  state.party.forEach(p=>{
    const eq = EQUIP[p.classId];
    const weaponTier = eq.weapons[legIndex-1];
    const armorTier = eq.armor[legIndex-1];
    if(weaponTier && (!p.weapon || p.weapon.tier < weaponTier.tier)) items.push({slot:'weapon', item:weaponTier, ownerId:p.id});
    if(armorTier && (!p.armor || p.armor.tier < armorTier.tier)) items.push({slot:'armor', item:armorTier, ownerId:p.id});
    // Town II also stocks tier-3 gear as an expensive "buy ahead" option —
    // but only when it would actually be an upgrade, so a character who
    // already found tier-3 as a drop isn't offered a duplicate.
    if(legIndex===2){
      const w3 = eq.weapons[2], a3 = eq.armor[2];
      if(w3 && (!p.weapon || p.weapon.tier < w3.tier)) items.push({slot:'weapon', item:w3, ownerId:p.id});
      if(a3 && (!p.armor || p.armor.tier < a3.tier)) items.push({slot:'armor', item:a3, ownerId:p.id});
    }
  });
  return items;
}
function rollRecruitOffer(){
  if(state.party.length>=MAX_PARTY) return null;
  const have = state.party.map(p=>p.classId);
  const missing = CLASS_ORDER.filter(c=>!have.includes(c));
  if(missing.length===0) return null;
  if(Math.random()>0.75) return null;
  return choice(missing);
}
function avgPartyLevel(){
  const lv = state.party.reduce((s,p)=>s+p.level,0)/state.party.length;
  return Math.max(1, Math.round(lv));
}
function recruit(classId){
  if(state.party.length>=MAX_PARTY) return;
  const c = createCharacter(classId, avgPartyLevel());
  // Companions above level 1 skip createCharacter's starting kit, and one who
  // joins at level 9 with empty slots is close to useless beside a party in
  // tier-3 equipment. They arrive carrying what the *previous* town stocked,
  // and never worse than the tier-1 kit every character now starts with —
  // otherwise a higher-level recruit could show up more poorly equipped than
  // a level-1 one. Still a tier behind what the player has been buying, so
  // kitting them out properly stays worthwhile.
  const gearTier = Math.min(3, Math.max(1, (state.legIndex||0) - 1));
  const eq = EQUIP[classId];
  if(!c.weapon || c.weapon.tier < gearTier) c.weapon = eq.weapons[gearTier-1] || c.weapon;
  if(!c.armor  || c.armor.tier  < gearTier) c.armor  = eq.armor[gearTier-1]  || c.armor;
  // An old friend picks up close to where you left off — see dismissAndRecruit
  // for what parting costs. Set before recalcDerived, because Bond II is part
  // of maximum health and they should walk in already carrying it.
  c.battlesTogether = bondMemory()[classId] || 0;
  recalcDerived(c);
  c.hp = c.maxHp; c.mp = c.maxMp;
  state.party.push(c);
  rosterAdd(classId);
}

// Companions can be dismissed, and the ending is about everyone who walked a
// road with you rather than everyone standing beside you at the end. So the
// roster is append-only and separate from the party.
function rosterAdd(classId){
  if(!state) return;
  if(!Array.isArray(state.roster)) state.roster = [];
  if(classId && state.roster.indexOf(classId) < 0) state.roster.push(classId);
}
function epilogueCast(){
  const seen = [];
  const push = id => { if(id && seen.indexOf(id) < 0) seen.push(id); };
  (state.roster || []).forEach(push);
  // Belt and braces: whoever is standing here at the end is in it regardless
  // of whether the roster was recorded properly, including in old saves that
  // predate the roster existing at all.
  (state.party || []).forEach(p => push(p.classId));
  // The Hero's sprite depends on their name, so the name has to travel with
  // the class id or the ending shows a Hero the player has never seen.
  const named = {};
  (state.party || []).forEach(p => { named[p.classId] = p.name; });
  return seen.slice(0, 6).map(classId => ({classId, name: named[classId]}));
}
// Where each member of the ending cast stands.
//
// The first one is nearest and the rest fan out from the centre alternately
// left and right, each pair one step further back — so the group has depth
// and its silhouettes overlap. Widths step 128 / 112 / 96 / 80, all exact
// multiples of the 64px source, because a sprite scaled by 1.7 has fuzzy
// pixels and this is the one screen the player looks at rather than plays.
//
// The whole fan is then recentred, which matters because the raw fan is
// lopsided at even counts: six members come out at 14..74 before the shift and
// 20..80 after it. The nearest figure lands slightly right of centre,
// which is better than dead centre anyway.
const CAST_WIDTHS = [128, 112, 96, 80];
function castSlots(n){
  const fan = [0, -1, 1, -2, 2, -3];
  const slots = [];
  for(let i = 0; i < n; i++){
    const k = fan[i % fan.length];
    const depth = Math.min(CAST_WIDTHS.length - 1, Math.abs(k));
    slots.push({ x: 50 + k * 12, y: 3 + depth * 4.5, w: CAST_WIDTHS[depth], z: 10 - depth });
  }
  const mean = slots.reduce((a, s) => a + s.x, 0) / (slots.length || 1);
  slots.forEach(s => { s.x += 50 - mean; });
  return slots;
}
// One figure on a plate, at the same pixel scale a 64px sprite gets — so the
// Demon Lord's 96px frame comes out half again as large, which is the whole
// point of him being authored at 96.
function soloCastHtml(spriteKey){
  const url = spriteUrl(spriteKey);
  if(!url) return '';
  const base = ASSET_MANIFEST.frameSize || 64;
  // Capped at 46% of the plate's width: the plate is 56% as tall as it is
  // wide, so anything wider than that pushes a square sprite out of the top
  // of the frame. Only the 128px Demon Lord on a phone ever reaches the cap.
  const w = Math.round(168 * ((ASSET_MANIFEST.frameSizes && ASSET_MANIFEST.frameSizes[spriteKey]) || base) / base);
  return `<div class="stage-cast solo"><div class="unit-sprite sheet st-idle"
    style="background-image:url('${url}');width:min(calc(${w}px * var(--cast-shrink, 1)), 46%)"></div></div>`;
}
function castMemberHtml(member, i, all){
  const sprite = spriteFor({isEnemy:false, classId:member.classId, name:member.name});
  if(!sprite) return '';
  const slot = castSlots(all.length)[i];
  const style = `background-image:url('${sprite}');left:${slot.x.toFixed(1)}%;`
              + `bottom:${slot.y}%;width:calc(${slot.w}px * var(--cast-shrink, 1));`
              + `z-index:${slot.z}`;
  return `<div class="unit-sprite sheet st-idle" style="${style}"></div>`;
}

/* =========================================================
   SAVING — suspend/resume, export codes, cross-run records

   The run is saved so that closing the tab costs nothing. It is NOT a
   safety net against losing: a party wipe deletes the save, because the
   difficulty is tuned around a run you only get one attempt at.

   Only "safe" screens are saved (see SAVE_SAFE_SCREENS). At those moments
   there is no combat in flight, no event mid-resolution and no queued
   continuation closure, which is what makes the state serialisable at all —
   `state` otherwise holds live object references and functions that JSON
   cannot represent.
   ========================================================= */
const SAVE_VERSION = 1;             // bump whenever class/skill/gear DATA changes shape or values enough that an old save would rebuild into a different character
const SAVE_KEY = 'veilfall.save.v1';
const RECORDS_KEY = 'veilfall.records.v1';
const BESTIARY_KEY = 'veilfall.bestiary.v1';

// Every creature in the game, in the order the player meets them. Built from
// the same REGIONS table the fights are built from, so a region added later
// appears here without anything else being touched — and the `key` is the
// sprite key, which is what makes an entry able to draw itself.
const BESTIARY_ROLE_NOTE = {
  grunt:'Common', skirmisher:'Swift', brute:'Heavy', boss:'Region boss'
};
const BESTIARY = (()=>{
  const rows = [];
  REGION_IDS.forEach(rid=>{
    ['grunt','skirmisher','brute','boss'].forEach(role=>{
      rows.push({key:rid+'_'+role, name:REGIONS[rid].names[role],
                 group:REGIONS[rid].name, note:BESTIARY_ROLE_NOTE[role]});
    });
  });
  rows.push({key:'castle_guard',   name:'Elite Guard',            group:'The Castle', note:'Heavy'});
  rows.push({key:'abyssal_wraith', name:'Abyssal Wraith',         group:'The Castle', note:'Summoned'});
  rows.push({key:'demonlord',      name:'The Demon Lord',         group:'The Castle', note:'First form'});
  rows.push({key:'demonlord_2',    name:'The Demon Lord Unbound', group:'The Castle', note:'Second form'});
  return rows;
})();
const BESTIARY_GROUPS = BESTIARY.reduce((acc,row)=>{
  (acc[row.group] = acc[row.group] || []).push(row); return acc;
}, {});
const SAVE_CODE_PREFIX = 'VF1';

// Screens where nothing is mid-resolution. Combat, events, the level-up
// screen and the two name/class entry steps are deliberately absent.
const SAVE_SAFE_SCREENS = ['heroBuild','blessing','regionSelect','regionIntro','town','partyStats','guild','shop','trainer','finalLegIntro','castleGate','castleGate2'];
// Menus that sit on top of a safe screen rather than being part of the run.
// Saving from one of these is fine, but the run has to be stored as the
// screen underneath — resuming into the save-code screen would be absurd,
// and deserializeRun refuses any screen it does not recognise as safe.
const SAVE_AUX_SCREENS = ['saveCode','records','bestiary','loadCode'];

// How far a run got, for the defeat screen and the records table.
const RUN_STAGES = ['Leg I','the first town','Leg II','the second town','Leg III','the last town','the castle gate','the throne room','victorious'];
function markStage(i){ if(!state) return; if(!(state.furthestStage>=i)) state.furthestStage = i; }

// Gear and skills live in shared data tables, so a save stores their names
// and looks the real objects back up on load. Storing copies would silently
// fossilise old balance values into a save.
const EQUIP_BY_NAME = (()=>{
  const map = {};
  Object.keys(EQUIP).forEach(cid=>{
    EQUIP[cid].weapons.forEach(w=>{ map[w.name] = w; });
    EQUIP[cid].armor.forEach(a=>{ map[a.name] = a; });
  });
  map[HERO_STARTING_WEAPON.name] = HERO_STARTING_WEAPON;
  map[HERO_STARTING_ARMOR.name] = HERO_STARTING_ARMOR;
  return map;
})();
const SKILL_BY_NAME = (()=>{
  const map = {};
  CLASS_ORDER.forEach(cid=>{
    CLASSES[cid].skills.forEach(sk=>{ map[sk.name] = sk; });
    if(BONUS_SKILLS[cid]) map[BONUS_SKILLS[cid].name] = BONUS_SKILLS[cid];
  });
  return map;
})();

/* ---------- storage, defensively ---------- */
let _storageChecked = false, _storageOk = false;
function storageAvailable(){
  if(_storageChecked) return _storageOk;
  _storageChecked = true;
  try {
    if(typeof localStorage === 'undefined'){ _storageOk = false; return false; }
    localStorage.setItem('veilfall.probe','1');
    localStorage.removeItem('veilfall.probe');
    _storageOk = true;
  } catch(e){
    // Private browsing, a disabled-storage setting, or a sandboxed frame.
    // Saving is simply off in that case; export codes still work, since
    // they are just text the player holds onto themselves.
    _storageOk = false;
  }
  return _storageOk;
}
function storageRead(key){
  if(!storageAvailable()) return null;
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function storageWrite(key, value){
  if(!storageAvailable()) return false;
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ return false; }   // quota, or storage revoked mid-session
}
function storageRemove(key){
  if(!storageAvailable()) return;
  try { localStorage.removeItem(key); } catch(e){}
}

/* ---------- serialisation ---------- */
// Drops keys the loader already defaults, which is most of them for most
// characters — no statuses, no trained skills, no upgrades, no allocated
// points. Zeros are kept, since `exp: 0` is meaningfully different from
// "absent" once the loader starts trusting defaults.
function compact(obj){
  const out = {};
  Object.keys(obj).forEach(k=>{
    const v = obj[k];
    if(v===null || v===undefined || v===false) return;
    if(Array.isArray(v) && v.length===0) return;
    if(v && typeof v==='object' && !Array.isArray(v) && Object.keys(v).length===0) return;
    out[k] = v;
  });
  return out;
}
function serializeCharacter(c){
  return compact({
    id:c.id, cls:c.classId, name:c.name, level:c.level, exp:c.exp, hp:c.hp, mp:c.mp,
    weapon: c.weapon ? c.weapon.name : null,
    armor:  c.armor  ? c.armor.name  : null,
    statuses: (c.statuses||[]).map(st=>Object.assign({}, st)),
    trained: (c.trainedSkills||[]).slice(),
    bonus: !!c.bonusSkillLearned,
    upgrades: Object.assign({}, c.skillUpgrades||{}),
    alloc: c.allocatedStats ? Object.assign({}, c.allocatedStats) : null,
    spent: c.statSpent ? Object.assign({}, c.statSpent) : null,
    batch: c.statSpentThisBatch ? Object.assign({}, c.statSpentThisBatch) : null,
    pendingPts: c.pendingStatPoints||0,
    heroSkills: c.heroSkills ? c.heroSkills.map(sk=>sk.name) : null,
    pendingTiers: c.pendingSkillTiers ? c.pendingSkillTiers.slice() : null,
    resolvedTiers: c.resolvedSkillTiers ? c.resolvedSkillTiers.slice() : null,
    manual: !!c.manualStatsEnabled,
    manualFrom: c.manualModeFrozenAtLevel,
    together: c.battlesTogether || 0,
    lead: !!c.isLead,
    bondUsed: !!c.bondSaveUsed
  });
}
// Rebuilds a character from scratch and then overlays the saved values, so
// anything derived (max HP, the Hero's synthesised classDef) is recomputed
// from current game data rather than trusted from the save.
function deserializeCharacter(d){
  const c = d.cls==='hero' ? createHeroCharacter(d.name) : createCharacter(d.cls, 1);
  c.id = d.id;
  if(d.name) c.name = d.name;
  c.level = d.level; c.exp = d.exp;
  c.weapon = d.weapon ? (EQUIP_BY_NAME[d.weapon] || null) : null;
  c.armor  = d.armor  ? (EQUIP_BY_NAME[d.armor]  || null) : null;
  c.trainedSkills = (d.trained||[]).slice();
  c.bonusSkillLearned = !!d.bonus;
  c.skillUpgrades = Object.assign({}, d.upgrades||{});
  if(d.alloc) c.allocatedStats = Object.assign({}, d.alloc);
  if(d.spent) c.statSpent = Object.assign({}, d.spent);
  if(d.batch) c.statSpentThisBatch = Object.assign({}, d.batch);
  c.pendingStatPoints = d.pendingPts||0;
  if(d.cls==='hero'){
    c.heroSkills = (d.heroSkills||[]).map(n=>SKILL_BY_NAME[n]).filter(Boolean);
    c.pendingSkillTiers = (d.pendingTiers||[]).slice();
    c.resolvedSkillTiers = (d.resolvedTiers||[]).slice();
  }
  c.manualStatsEnabled = !!d.manual;
  if(d.manualFrom!==undefined && d.manualFrom!==null) c.manualModeFrozenAtLevel = d.manualFrom;
  c.statuses = (d.statuses||[]).map(st=>Object.assign({}, st));
  c.battlesTogether = d.together || 0;
  c.isLead = !!d.lead;
  c.defending = false;
  c.bondSaveUsed = !!d.bondUsed;
  c.maxHp = computeMaxHp(c); c.maxMp = computeMaxMp(c);
  c.hp = Math.max(0, Math.min(c.maxHp, d.hp));
  c.mp = Math.max(0, Math.min(c.maxMp, d.mp));
  return c;
}
function serializeRun(){
  return compact({
    v: SAVE_VERSION,
    screen: resolvedSaveScreen() || state.screen,
    party: state.party.map(serializeCharacter),
    roster: (state.roster||[]).slice(),
    bonds: Object.assign({}, state.bonds||{}),
    gold: state.gold,
    blessing: state.blessing,
    usedGuardianAngel: !!state.usedGuardianAngel,
    bondSaveSpent: !!state.bondSaveSpent,
    legIndex: state.legIndex,
    regionPool: state.regionPool.slice(),
    travel: state.travel ? {
      regionId: state.travel.regionId, tier: state.travel.tier, nodeIndex: state.travel.nodeIndex,
      route: state.travel.route || null,
      nodes: state.travel.nodes.map(n=>({type:n.type, eventKind:n.eventKind}))
    } : null,
    inventory: Object.assign({}, state.inventory),
    townShop: state.townShop ? state.townShop.map(e=>({slot:e.slot, item:e.item.name, ownerId:e.ownerId})) : null,
    townRecruitOffer: state.townRecruitOffer || null,
    guildRecruitOptions: (state.guildRecruitOptions||[]).slice(),
    guildRecruitUsed: !!state.guildRecruitUsed,
    guildMissionOptions: (state.guildMissionOptions||[]).map(m=>Object.assign({}, m)),
    guildMissionUsed: !!state.guildMissionUsed,
    guildEngagementCount: state.guildEngagementCount||0,
    guildPendingRecruitClass: state.guildPendingRecruitClass || null,
    battles: state.battlesFought||0,
    furthestStage: state.furthestStage||0,
    combatSpeed: state.combatSpeed||null,
    startedAt: state.runStartedAt||null,
    uid: uidCounter
  });
}
// Returns true on success. Anything malformed is refused outright rather
// than half-applied — a partially loaded run is worse than no run.
function deserializeRun(d){
  if(!d || d.v!==SAVE_VERSION) return false;
  if(!Array.isArray(d.party) || !d.party.length) return false;
  if(!d.party.every(pc=>pc && (pc.cls==='hero' || CLASSES[pc.cls]))) return false;
  if(!Array.isArray(d.regionPool) || d.regionPool.length!==REGION_IDS.length) return false;
  if(SAVE_SAFE_SCREENS.indexOf(d.screen)<0) return false;
  const snapshot = state;
  try {
    newGame();
    // Blessing first: computeMaxHp/computeMaxMp read it, so the party cannot
    // be rebuilt correctly until it is in place.
    state.blessing = d.blessing;
    state.screen = d.screen;
    state.gold = d.gold;
    state.usedGuardianAngel = !!d.usedGuardianAngel;
    state.bondSaveSpent = !!d.bondSaveSpent;
    state.legIndex = d.legIndex;
    state.regionPool = d.regionPool.slice();
    state.inventory = Object.assign({potion:0, ether:0, elixir:0}, d.inventory||{});
    // Absent in saves written before the ending existed; the party's own
    // classes are added back by epilogueCast() either way.
    state.roster = Array.isArray(d.roster) ? d.roster.slice() : [];
    // Absent before bonds existed; an empty memory is exactly right for those.
    state.bonds = (d.bonds && typeof d.bonds === 'object') ? Object.assign({}, d.bonds) : {};
    state.travel = d.travel ? {
      regionId: d.travel.regionId, tier: d.travel.tier, nodeIndex: d.travel.nodeIndex,
      // Absent in saves written before roads existed. null means "no road",
      // which is exactly the old behaviour: every multiplier defaults and
      // partialRecover falls back to its own 0.30.
      route: d.travel.route || null,
      nodes: (d.travel.nodes||[]).map(n=>({type:n.type, eventKind:n.eventKind}))
    } : null;
    state.party = d.party.map(deserializeCharacter);
    // Saves written before bonds existed carry no lead flag, and without one
    // the player character would quietly start earning a bond with themselves.
    if(state.party.length && !state.party.some(p=>p.isLead)) state.party[0].isLead = true;
    state.townShop = d.townShop
      ? d.townShop.map(e=>({slot:e.slot, item:EQUIP_BY_NAME[e.item], ownerId:e.ownerId})).filter(e=>e.item)
      : null;
    state.townRecruitOffer = d.townRecruitOffer || null;
    state.guildRecruitOptions = (d.guildRecruitOptions||[]).slice();
    state.guildRecruitUsed = !!d.guildRecruitUsed;
    state.guildMissionOptions = (d.guildMissionOptions||[]).map(m=>Object.assign({}, m));
    state.guildMissionUsed = !!d.guildMissionUsed;
    state.guildEngagementCount = d.guildEngagementCount||0;
    state.guildPendingRecruitClass = d.guildPendingRecruitClass || null;
    state.battlesFought = d.battles||0;
    state.furthestStage = d.furthestStage||0;
    state.combatSpeed = d.combatSpeed || defaultCombatSpeed();
    state.runStartedAt = d.startedAt || Date.now();
    // Saved ids were handed out by an earlier session's counter; make sure
    // this one never reissues them.
    uidCounter = Math.max(uidCounter, (d.uid||1)+1);
    return true;
  } catch(e){
    state = snapshot;
    return false;
  }
}

/* ---------- autosave / continue ---------- */
function resolvedSaveScreen(){
  if(!state) return null;
  if(SAVE_SAFE_SCREENS.indexOf(state.screen)>=0) return state.screen;
  if(SAVE_AUX_SCREENS.indexOf(state.screen)>=0) return state.lastSafeScreen || 'town';
  return null;
}
function canSaveNow(){
  return !!state && Array.isArray(state.party) && state.party.length>0
    && !state.combat && !state.currentEvent && !state._resumeAfterHeroLevelUp
    && resolvedSaveScreen()!==null;
}
function autosave(){
  if(!canSaveNow()) return false;
  return storageWrite(SAVE_KEY, serializeRun());
}
function clearSave(){ storageRemove(SAVE_KEY); }
function hasSavedRun(){ const d = storageRead(SAVE_KEY); return !!(d && d.v===SAVE_VERSION && d.party && d.party.length); }
// A one-line description of the stored run, so Continue says what it will
// actually resume rather than being a leap of faith.
function savedRunSummary(){
  const d = storageRead(SAVE_KEY);
  if(!d || d.v!==SAVE_VERSION || !d.party || !d.party.length) return null;
  const lead = d.party[0];
  const lvl = Math.round(d.party.reduce((a,pc)=>a+pc.level,0)/d.party.length);
  const cls = lead.cls==='hero' ? 'Hero' : (CLASSES[lead.cls] ? CLASSES[lead.cls].name : lead.cls);
  return {
    name: lead.name, className: cls, partySize: d.party.length, avgLevel: lvl,
    stage: RUN_STAGES[Math.min(RUN_STAGES.length-1, d.furthestStage||0)],
    battles: d.battles||0
  };
}
function continueSavedRun(){
  const d = storageRead(SAVE_KEY);
  if(!deserializeRun(d)){
    clearSave();
    state.loadError = 'That saved run could not be read, so it has been cleared. This usually means the game file changed since it was saved.';
    state.screen = 'intro';
  }
  render();
}

/* ---------- export / import codes ---------- */
function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToUtf8(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
// FNV-1a. Not security — this exists so a code that lost characters on its
// way through a chat window or an email client fails loudly instead of
// loading a subtly wrong run.
function saveCodeChecksum(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('0000000' + h.toString(36)).slice(-7);
}
function exportSaveCode(){
  if(!canSaveNow()) return null;
  const b64 = utf8ToB64(JSON.stringify(serializeRun()));
  return SAVE_CODE_PREFIX + '-' + saveCodeChecksum(b64) + '-' + b64;
}
function importSaveCode(raw){
  const code = (raw||'').replace(/\s+/g,'');
  if(!code) return {ok:false, error:'Paste a save code first.'};
  const m = new RegExp('^' + SAVE_CODE_PREFIX + '-([0-9a-z]{7})-(.+)$').exec(code);
  if(!m) return {ok:false, error:'That does not look like a Veilfall save code — they begin with ' + SAVE_CODE_PREFIX + '-.'};
  if(saveCodeChecksum(m[2]) !== m[1]) return {ok:false, error:'This code is damaged or incomplete. Check that nothing was cut off when it was copied.'};
  let data;
  try { data = JSON.parse(b64ToUtf8(m[2])); }
  catch(e){ return {ok:false, error:'This code could not be read.'}; }
  if(data && data.v!==SAVE_VERSION) return {ok:false, error:'This code is from a different version of Veilfall (save format ' + data.v + ', this build reads ' + SAVE_VERSION + ').'};
  if(!deserializeRun(data)) return {ok:false, error:'This code was readable but the run inside it was not valid.'};
  autosave();
  return {ok:true};
}

/* ---------- records across runs ---------- */
function blankRecords(){
  return {v:1, runs:0, wins:0, battles:0, byClass:{}, bestParty:0, fewestBattlesToWin:null, furthest:0};
}
function readRecords(){
  const d = storageRead(RECORDS_KEY);
  if(!d || d.v!==1) return blankRecords();
  return Object.assign(blankRecords(), d, {byClass: Object.assign({}, d.byClass||{})});
}
function recordRunEnd(won){
  if(!storageAvailable() || !state || !state.party || !state.party.length) return;
  const r = readRecords();
  const lead = state.party[0];
  const cls = lead.classId;
  const avg = Math.round(state.party.reduce((a,p)=>a+p.level,0)/state.party.length);
  const stage = won ? RUN_STAGES.length-1 : (state.furthestStage||0);
  r.runs += 1;
  r.battles += state.battlesFought||0;
  if(won) r.wins += 1;
  if(avg > r.bestParty) r.bestParty = avg;
  if(stage > r.furthest) r.furthest = stage;
  if(won && (r.fewestBattlesToWin===null || (state.battlesFought||0) < r.fewestBattlesToWin)){
    r.fewestBattlesToWin = state.battlesFought||0;
  }
  const c = r.byClass[cls] || {runs:0, wins:0, furthest:0};
  c.runs += 1;
  if(won) c.wins += 1;
  if(stage > c.furthest) c.furthest = stage;
  r.byClass[cls] = c;
  storageWrite(RECORDS_KEY, r);
}
function resetRecords(){ storageRemove(RECORDS_KEY); render(); }

/* ---------- the bestiary ----------
   Kept in its own key rather than inside `records`, so that erasing the run
   history does not also erase thirty entries the player spent a dozen hours
   filling in. Both are written through the same defensive storage helpers, so
   a browser that refuses to store anything degrades to an empty codex rather
   than to a crash. */
function readBestiary(){
  const d = storageRead(BESTIARY_KEY);
  return (d && typeof d === 'object') ? {seen:d.seen||{}, slain:d.slain||{}} : {seen:{}, slain:{}};
}
// Called with sprite keys, not with units: the key is stable, it names the
// art, and it already distinguishes the Demon Lord's two forms — which a role
// name does not.
function bestiarySee(keys){
  if(!keys || !keys.length) return;
  const b = readBestiary();
  let dirty = false;
  keys.forEach(k=>{ if(k && !b.seen[k]){ b.seen[k] = 1; dirty = true; } });
  if(dirty) storageWrite(BESTIARY_KEY, b);
}
function bestiarySlay(keys){
  if(!keys || !keys.length) return;
  const b = readBestiary();
  keys.forEach(k=>{ if(k){ b.seen[k] = 1; b.slain[k] = (b.slain[k]||0) + 1; } });
  storageWrite(BESTIARY_KEY, b);
}
// The sprite key for an enemy, resolved against the region it was met in
// rather than against wherever the player happens to be standing now.
function bestiaryKeyFor(enemy){
  return spriteKeyFor(enemy, enemy.regionId || currentRegionId());
}
function resetBestiary(){ storageRemove(BESTIARY_KEY); render(); }
// The return screen is a module variable rather than a field on `state`,
// because `state` is serialised: a save that remembered "the player was
// looking at the codex" would either have to be migrated later or would sit
// in the format forever meaning nothing.
let bestiaryReturnScreen = 'intro';
function openBestiary(){
  bestiaryReturnScreen = (state && state.screen) || 'intro';
  state.screen = 'bestiary'; render();
}
function closeBestiary(){
  state.screen = bestiaryReturnScreen || 'intro'; render();
}

/* =========================================================
   UI ACTIONS
   ========================================================= */
function newGame(){
  state = {
    screen:'intro', party:[], gold:STARTING_GOLD, blessing:null, usedGuardianAngel:false,
    legIndex:0, regionPool:shuffle(REGION_IDS), travel:null, combat:null, currentEvent:null,
    inventory:{potion:2, ether:1, elixir:1}, townShop:null, townRecruitOffer:null,
    guildRecruitOptions:[], guildRecruitUsed:false, guildMissionOptions:[], guildMissionUsed:false, guildMission:null,
    guildEngagementCount:0, guildPendingRecruitClass:null,
    // Run bookkeeping, for the end-of-run summary and the records table.
    battlesFought:0, furthestStage:0, lastCombatContext:null, runStartedAt: Date.now(),
    lastSafeScreen:null, loadError:null, combatSpeed: defaultCombatSpeed()
  };
}
// Starting fresh discards whatever was saved. Doing it here rather than at
// the first autosave means the old run is gone the moment the player commits,
// instead of lingering in storage in a half-replaced state.
function beginNewRun(classId){
  clearSave();
  state.loadError = null;
  chooseClass(classId);
}
function chooseClass(classId){
  state.pendingClassChoice = classId;

}
function confirmName(typedName){
  const classId = state.pendingClassChoice;
  const name = sanitizeHeroName(typedName);
  let character;
  if(classId==='hero'){
    character = createHeroCharacter(name);
  } else {
    character = createCharacter(classId,1);
    if(name) character.name = name;
  }
  character.isLead = true;
  state.party = [character];
  state.roster = [character.classId];
  state.pendingClassChoice = null;
  if(classId==='hero'){
    state.screen = 'heroBuild';
  } else {
    state.blessing = choice(BLESSINGS).id;
    state.screen = 'blessing';
  }

}
function heroAllStatsCapped(c){
  const cap = statCapFor(c);
  return Object.keys(HERO_POINT_VALUE).every(stat => (c.statSpent[stat]||0) >= cap);
}
function confirmHeroBuild(){
  const c = state.party[0];
  if((c.pendingSkillTiers||[]).length>0) return;
  if(c.pendingStatPoints>0 && !heroAllStatsCapped(c)) return;
  c.pendingStatPoints = 0; // forfeit any points that literally can't be spent (all stats capped)
  state.blessing = choice(BLESSINGS).id;
  state.screen = 'blessing';
  render();
}
function pendingLevelUpChars(){
  // Deliberately not filtered by hp>0. The level-gap catch-up can level a
  // character who is currently dead, and this screen is the only place their
  // points and skill picks can be spent — filtering them out here stranded
  // those points until some later victory happened to find them alive.
  return state.party.filter(p=>(p.pendingStatPoints>0) || (p.pendingSkillTiers||[]).length>0);
}
// Characters actually shown on the heroLevelUp screen — fixed at the
// moment it opens, so a character's card (and its +/- undo buttons)
// doesn't vanish from view the instant their last point lands. Without
// this, reaching 0 pending points mid-review looked like the screen had
// already moved on, with no way left to fix a misclick.
function levelUpScreenChars(){
  return (state.levelUpScreenCharIds||[]).map(id=>state.party.find(p=>p.id===id)).filter(Boolean);
}
function finishHeroLevelUp(){
  const stillPending = levelUpScreenChars().some(c => (c.pendingStatPoints>0 && !heroAllStatsCapped(c)) || (c.pendingSkillTiers||[]).length>0);
  if(stillPending) return;
  state.party.forEach(c=>{ if(c.pendingStatPoints>0) c.pendingStatPoints = 0; }); // forfeit any unspendable remainder (all stats capped)
  state.levelUpScreenCharIds = null;
  const resume = state._resumeAfterHeroLevelUp;
  state._resumeAfterHeroLevelUp = null;
  if(resume) resume(); else render();
}
function triggerHeroLevelUpIfPending(nextAction){
  const pending = pendingLevelUpChars();
  if(pending.length>0){
    state.levelUpScreenCharIds = pending.map(c=>c.id);
    state._resumeAfterHeroLevelUp = nextAction;
    state.screen = 'heroLevelUp';
    render();
    return true;
  }
  return false;
}

function combatChooseAction(kind, payload){
  const c = state.combat, actor = c.pendingActor;
  if(!actor || c.playing) return;
  let action;
  if(kind==='basic') action = {name:'Attack', kind:'attack', school:'phys', power:1.0, mp:0, target:'singleEnemy'};
  else if(kind==='defend') action = {name:'Defend', kind:'defend', mp:0};
  else if(kind==='skill') action = getCharacterSkills(actor)[payload];
  if(!action) return;
  if(action.target==='allEnemies' || action.target==='allAllies' || action.target==='self'){
    c.pendingActor = null;
    beginTurnBatch();
    resolveAction(actor, action, null);
    c.turnIndex++;
    runCombatLoop();
    presentTimeline();
    return;
  }
  state.pendingActionChoice = action;
  render();
}
function combatChooseTarget(targetId){
  const c = state.combat, actor = c.pendingActor, action = state.pendingActionChoice;
  if(!actor || !action || c.playing) return;
  let target = null;
  if(action.target==='singleEnemy') target = c.enemies.find(e=>e.id===targetId);
  else if(action.target==='singleAlly') target = c.allies.find(a=>a.id===targetId);
  else if(action.target==='singleDeadAlly') target = c.allies.find(a=>a.id===targetId);
  c.pendingActor = null;
  state.pendingActionChoice = null;
  beginTurnBatch();
  resolveAction(actor, action, target);
  c.turnIndex++;
  runCombatLoop();
  presentTimeline();
}
function combatChooseItem(itemKey){
  state.pendingActionChoice = {name:CONSUMABLES[itemKey].name, kind:'item', item:itemKey, target:'singleAlly'};
  render();
}
function combatCancelChoice(){
  state.pendingActionChoice = null;
  render();
}
function continueAfterCombat(){
  const c = state.combat;
  const context = c.context;
  state.combat = null;
  const proceed = () => {
    // Ticked here rather than inside each branch below: guild missions and
    // both castle fights used to return early without ever reaching it, so a
    // shrine's Emboldened/Shaken rode through the entire endgame without
    // counting down.
    tickEventBuffsAfterBattle();
    if(context==='event'){
      resolveTravelerOrChestFollowup();
      return;
    }
    if(context==='castleGauntlet'){
      // Deliberately no partialRecover() here. The castle is one continuous
      // assault, and with a breather in between the gauntlet cost nothing:
      // parties reached the Demon Lord at 97% health however hard the guards
      // were made, so the fight could never be a warning shot. Whatever the
      // guards take out of you, you carry into the throne room.
      state.screen='castleGate2';
      render();
      return;
    }
    if(context==='demonlord'){
      markStage(8);
      recordRunEnd(true);
      clearSave();          // the run is over either way; nothing left to resume
      state.epilogueIndex = 0;
      state.screen='epilogue';
      render();
      return;
    }
    if(context==='guildMission'){
      partialRecover();
      state.guildMission.nodeIndex++;
      advanceGuildMission();
      return;
    }
    partialRecover();
    applyRoadToll();
    if(state.travel){
      state.travel.nodeIndex++;
      advanceRegion();
      render();
    }
  };
  if(!triggerHeroLevelUpIfPending(proceed)) proceed();
}
function resolveTravelerOrChestFollowup(){
  // The event is finished the moment its fight resolves. Leaving
  // state.currentEvent set here was harmless while nothing read it, but it
  // lingered for the rest of the leg — and it holds closures, so anything
  // asking "is the game at a serialisable moment?" was told no from the
  // first ambush onward.
  state.currentEvent = null;
  state.eventFollowupText = 'You emerge victorious and recover a little gold for your trouble.';
  const gold = 15 + randInt(15);
  state.gold += gold;
  if(state.pendingEventOutcome && state.pendingEventOutcome.type==='travelerFight' && Math.random()<0.5 && state.party.length<MAX_PARTY){
    const have = state.party.map(p=>p.classId);
    const missing = CLASS_ORDER.filter(c=>!have.includes(c));
    if(missing.length){
      const cls = choice(missing);
      recruit(cls);
      state.eventFollowupText = `You rescue a grateful ${CLASSES[cls].name}, who asks to join your cause!`;
    }
  }
  state.pendingEventOutcome = null;
  state.screen = 'eventFollowup';
  render();
}
function eventChoice(index){
  const ev = state.currentEvent;
  const outcome = ev.choices[index].resolve();
  if(outcome===null){ render(); return; } // triggered combat
  state.eventOutcomeText = outcome;
  state.screen = 'eventResult';
  render();
}
function continueAfterEvent(){
  state.currentEvent = null;
  state.eventOutcomeText = null;
  tickEventBuffsAfterBattle();
  applyRoadToll();
  state.travel.nodeIndex++;
  advanceRegion();
  render();
}
function continueAfterEventFollowup(){
  state.eventFollowupText = null;
  partialRecover();
  applyRoadToll();
  state.travel.nodeIndex++;
  advanceRegion();
  render();
}
function buyShopItem(idx){
  const entry = state.townShop[idx];
  if(!entry || state.gold < entry.item.price) return;
  const owner = state.party.find(p=>p.id===entry.ownerId);
  // The listing can go stale between being generated and being clicked: the
  // owner may have left the party, or may already have equal-or-better gear
  // in that slot (Town II stocks tier 2 AND tier 3, so buying the better one
  // leaves the lesser one on the shelf). Either way there is nothing worth
  // buying — drop the entry rather than charging for a downgrade.
  if(!owner){ state.townShop.splice(idx,1); render(); return; }
  const current = entry.slot==='weapon' ? owner.weapon : owner.armor;
  if(current && current.tier >= entry.item.tier){ state.townShop.splice(idx,1); render(); return; }
  state.gold -= entry.item.price;
  if(entry.slot==='weapon') owner.weapon = entry.item; else owner.armor = entry.item;
  recalcDerived(owner);
  // Clear every remaining listing for this character and slot that the new
  // item makes obsolete, including the one just bought.
  state.townShop = state.townShop.filter(e =>
    !(e.ownerId===entry.ownerId && e.slot===entry.slot && e.item.tier <= entry.item.tier));
  render();
}
function restParty(){
  // A road was briefly able to leave a debt here — arrive off the bold road
  // and the inn could only patch you back to 62%, on the theory that this was
  // the one cost gear could not buy its way out of. It made no difference
  // whatsoever: at a 50% rest cap with a 1.8x gold bonus the bold road still
  // won 75% of runs, because the bot simply bought potions with the gold the
  // road had just paid it. Gold converts into everything.
  //
  // That is the whole reason the bold road's bonus is 1.22x. See the ROUTES
  // table for the numbers.
  state.party.forEach(p=>{ p.hp=p.maxHp; p.mp=p.maxMp; p.statuses=[]; });
  render();
}
function acceptRecruitOffer(){
  if(state.townRecruitOffer){
    recruit(state.townRecruitOffer);
    state.townRecruitOffer = null;
    // The new companion wasn't in the party when the shop list was first
    // built for this town — regenerate it now so their gear is on offer
    // immediately instead of only showing up at the next town.
    state.townShop = generateShopItems(state.legIndex);
    render();
  }
}
function guildRecruit(classId){
  if(state.guildRecruitUsed) return;
  if(!(state.guildRecruitOptions||[]).includes(classId)) return;
  if(state.gold < GUILD_RECRUIT_COST) return;
  if(state.party.length >= MAX_PARTY){
    // Full up — hand off to the dismiss-to-make-room flow instead of
    // recruiting immediately.
    state.guildPendingRecruitClass = classId;
    render();
    return;
  }
  state.gold -= GUILD_RECRUIT_COST;
  recruit(classId);
  state.guildRecruitUsed = true;
  state.guildEngagementCount = (state.guildEngagementCount||0) + 1;
  state.townShop = generateShopItems(state.legIndex);
  render();
}
function dismissAndRecruit(memberId){
  const classId = state.guildPendingRecruitClass;
  if(!classId || state.guildRecruitUsed) return;
  const member = state.party.find(p=>p.id===memberId);
  // Guard on identity, not on class. This used to read `classId==='hero'`,
  // which protected a party led by the Hero and nothing else — a run started
  // as a Warrior could dismiss its own player character and carry on without
  // one. Nothing surfaced it because the guild screen's own list filtered the
  // same way, so the button was never drawn; the hole was in the function.
  if(!member || member.isLead || member.classId==='hero') return;
  if(state.gold < GUILD_RECRUIT_COST) return;
  state.gold -= GUILD_RECRUIT_COST;
  bondOnParting(member);
  state.party = state.party.filter(p=>p.id!==memberId);
  recruit(classId);
  state.guildRecruitUsed = true;
  state.guildEngagementCount = (state.guildEngagementCount||0) + 1;
  state.guildPendingRecruitClass = null;
  state.townShop = generateShopItems(state.legIndex);
  render();
}
// Sending someone away costs one level of whatever you had built with them,
// and no more. They drop to the bottom of the level below, so the memory is
// dented rather than erased — take them back and you are a few battles from
// where you were, not a dozen.
function bondOnParting(member){
  if(!member || member.isLead) return;
  const lvl = bondLevel(member);
  const floor = lvl > 1 ? BOND_STEPS[lvl - 2] : 0;
  bondMemory()[member.classId] = floor;
  member.battlesTogether = floor;
}
// What the guild screen promises before the player commits to it.
function bondAfterParting(member){
  const lvl = bondLevel(member);
  return lvl > 1 ? BOND_STEPS[lvl - 2] : 0;
}

function cancelDismissRecruit(){
  state.guildPendingRecruitClass = null;
  render();
}
function estimateMissionGold(m){
  // Gold is paid per enemy, not per encounter — this used to assume one enemy
  // per encounter and so quoted roughly half the real payout, making the
  // Dangerous jobs look worse than they are.
  return Math.round(GOLD_PER_REGULAR * state.legIndex * m.goldMult * m.encounterCount * avgEnemiesPerEncounter());
}
function startGuildMission(missionId){
  if(state.guildMissionUsed || state.legIndex>=3) return;
  const mission = (state.guildMissionOptions||[]).find(m=>m.id===missionId);
  if(!mission) return;
  state.guildMissionUsed = true;
  state.guildMission = Object.assign({}, mission, {nodeIndex:0});
  advanceGuildMission();
}
function advanceGuildMission(){
  const gm = state.guildMission;
  if(!gm) return;
  if(gm.nodeIndex >= gm.encounterCount){
    state.guildMission = null;
    state.guildEngagementCount = (state.guildEngagementCount||0) + 1;
    state.screen = 'town';
    render();
    return;
  }
  const enemies = generateEncounter(gm.regionId, state.legIndex);
  enemies.forEach(e=>{
    e.hp = Math.max(1, Math.round(e.hp*gm.tierMult)); e.maxHp = e.hp;
    e.atk = Math.max(1, Math.round(e.atk*gm.tierMult));
    e.mag = Math.round(e.mag*gm.tierMult);
  });
  startCombat(enemies, 'guildMission');
  render();
}

function trainUnlockSkill(charId, skillName){
  const c = state.party.find(p=>p.id===charId);
  if(!c) return;
  const skill = c.classDef.skills.find(s=>s.name===skillName);
  if(!skill || c.level>=skill.level) return;
  c.trainedSkills = c.trainedSkills||[];
  if(c.trainedSkills.includes(skillName)) return;
  const cost = SKILL_UNLOCK_COST[skill.level];
  if(state.gold < cost) return;
  state.gold -= cost;
  c.trainedSkills.push(skillName);
  render();
}
function trainLearnBonus(charId){
  const c = state.party.find(p=>p.id===charId);
  if(!c || c.bonusSkillLearned) return;
  if(state.gold < BONUS_SKILL_COST) return;
  state.gold -= BONUS_SKILL_COST;
  c.bonusSkillLearned = true;
  render();
}
function trainUpgradeSkill(charId, skillName){
  const c = state.party.find(p=>p.id===charId);
  if(!c) return;
  c.skillUpgrades = c.skillUpgrades||{};
  const cur = c.skillUpgrades[skillName]||0;
  if(cur>=MAX_SKILL_UPGRADES) return;
  const cost = SKILL_UPGRADE_COST[cur];
  if(state.gold < cost) return;
  state.gold -= cost;
  c.skillUpgrades[skillName] = cur+1;
  render();
}

/* =========================================================
   PRESENTATION LAYER — assets, the battle stage, timed playback

   Combat maths is untouched by everything in here. Resolution stays
   synchronous and complete: a player action is fully resolved the moment it
   is taken, exactly as before. What changed is that resolution now also
   RECORDS what happened, and the UI replays that recording over time.

   That split is deliberate. Animating the resolution itself would mean
   making every combat function async, which would break the headless
   simulator the balance work depends on. Instead, the simulator sees the
   same synchronous path it always did (HAS_DOM is false outside a browser,
   so playback is skipped and the timeline is flushed instantly).
   ========================================================= */

// folder beside it should look like the placeholder build, not like a page
